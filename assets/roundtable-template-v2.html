<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>__BOOK_TITLE__ 圆桌洞见</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;
  --bg2:#111118;
  --card:#16161e;
  --card2:#1c1c28;
  --fg:#e8e0d4;
  --fg2:#b0a89c;
  --muted:#6a6372;
  --accent:#c23b22;
  --accent-glow:rgba(194,59,34,0.3);
  --gold:#d4a843;
  --gold-glow:rgba(212,168,67,0.25);
  --border:#2a2a35;
  --blue:#4a6a9a;
  --purple:#8a4aaa;
  --green:#3a8a5c;
  --radius:10px;
  --ease:cubic-bezier(.4,0,.2,1)
}
html,body{height:100%;overflow:hidden;font-family:'Noto Serif SC','STSong','SimSun',serif;background:var(--bg);color:var(--fg)}
.deck{position:relative;width:100vw;height:100vh;overflow:hidden}

/* 进度条 */
.progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold));z-index:1000;transition:width .5s var(--ease);box-shadow:0 0 12px var(--accent-glow)}

/* 幻灯片 */
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:60px 80px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
.slide::-webkit-scrollbar{width:4px}.slide::-webkit-scrollbar-track{background:transparent}.slide::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.slide.active{display:flex}
.slide.hero{justify-content:center;align-items:center;text-align:center}
.slide.title-slide{justify-content:center;align-items:center;text-align:center}

/* 入场动画 */
.anim-up{opacity:0;transform:translateY(24px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.slide.active .anim-up{opacity:1;transform:translateY(0)}
.slide.active .anim-up:nth-child(1){transition-delay:.1s}
.slide.active .anim-up:nth-child(2){transition-delay:.18s}
.slide.active .anim-up:nth-child(3){transition-delay:.26s}
.slide.active .anim-up:nth-child(4){transition-delay:.34s}
.slide.active .anim-up:nth-child(5){transition-delay:.42s}
.slide.active .anim-up:nth-child(6){transition-delay:.5s}

.frame{width:100%;max-width:1000px;margin:0 auto}

/* 封面 */
.cover-badge{display:inline-block;padding:6px 16px;border:1px solid var(--accent);border-radius:20px;font-size:11px;color:var(--accent);margin-bottom:32px;letter-spacing:.05em}
.cover-title{font-size:clamp(36px,6vw,72px);font-weight:900;line-height:1.15;margin-bottom:20px;background:linear-gradient(135deg,var(--fg) 0%,var(--gold) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.cover-sub{font-size:16px;color:var(--fg2);margin-bottom:32px;line-height:1.8}
.cover-stats{display:flex;gap:40px;flex-wrap:wrap;justify-content:center}
.cover-stat{text-align:center}
.cover-stat-num{font-size:32px;font-weight:900;color:var(--accent)}
.cover-stat-label{font-size:12px;color:var(--muted);margin-top:4px}

/* 标题 */
.kicker{font-family:monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.45;margin-bottom:2vh}
.h-hero{font-weight:900;font-size:clamp(2.5rem,8vw,5rem);line-height:1.1;margin-bottom:2.5vh}
.h-xl{font-weight:700;font-size:clamp(1.4rem,3.5vw,2.2rem);line-height:1.25;margin-bottom:2vh}
.h-lg{font-weight:700;font-size:clamp(1.1rem,2.5vw,1.6rem);line-height:1.3;margin-bottom:1.5vh}
.h-md{font-weight:600;font-size:clamp(.95rem,1.5vw,1.2rem);margin-bottom:1vh}
.lead{font-weight:300;font-size:clamp(.9rem,1.2vw,1.05rem);line-height:1.85;opacity:.85}
.meta-row{font-family:monospace;font-size:12px;opacity:.45;display:flex;gap:1.5em;flex-wrap:wrap;margin-top:2vh}

/* 标签 */
.tag{display:inline-block;padding:4px 12px;border-radius:6px;font-size:12px;font-weight:600;margin:3px}
.tag-gold{background:rgba(212,168,67,.15);color:var(--gold);border:1px solid rgba(212,168,67,.2)}
.tag-red{background:rgba(194,59,34,.15);color:var(--accent);border:1px solid rgba(194,59,34,.2)}
.tag-blue{background:rgba(74,106,154,.15);color:var(--blue);border:1px solid rgba(74,106,154,.2)}
.tag-purple{background:rgba(138,74,170,.15);color:var(--purple);border:1px solid rgba(138,74,170,.2)}
.tag-green{background:rgba(58,138,92,.15);color:var(--green);border:1px solid rgba(58,138,92,.2)}

/* 发言块 */
.sp{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px;position:relative;overflow:hidden}
.sp::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--accent)}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.speaker-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#fff;flex-shrink:0;background:var(--accent)}
.sn{font-weight:700;font-size:1rem;color:var(--fg)}
.sr{font-size:11px;color:var(--muted);padding:2px 8px;background:var(--card2);border-radius:4px}
.st{font-size:.95rem;line-height:2;color:var(--fg2)}
.st strong{color:var(--fg);font-weight:700}
.st em{color:var(--gold);font-style:normal;font-weight:600}

/* 碰撞块 */
.cb{background:var(--card2);border:1px dashed var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;position:relative}
.cb::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--accent);border-radius:var(--radius) 0 0 var(--radius)}
.cb.blue{border-color:rgba(74,106,154,.3)}.cb.blue::before{background:var(--blue)}
.cb.purple{border-color:rgba(138,74,170,.3)}.cb.purple::before{background:var(--purple)}
.cb.green{border-color:rgba(58,138,92,.3)}.cb.green::before{background:var(--green)}
.cb.orange{border-color:rgba(212,168,67,.3)}.cb.orange::before{background:var(--gold)}
.cl{font-family:monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;color:var(--accent);font-weight:700}
.cl.blue{color:var(--blue)}.cl.purple{color:var(--purple)}.cl.green{color:var(--green)}.cl.orange{color:var(--gold)}

/* 洞见卡 */
.insight-c{background:linear-gradient(135deg,var(--card) 0%,var(--card2) 100%);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px;position:relative;overflow:hidden}
.insight-c::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold))}
.insight-q{font-size:1.1rem;font-weight:700;color:var(--gold);line-height:1.6;margin-bottom:8px}
.insight-a{font-size:.92rem;line-height:1.85;color:var(--fg2)}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card-num{font-weight:900;font-size:1.6rem;color:var(--accent);opacity:.5;margin-bottom:8px}
.card-title{font-weight:700;font-size:1rem;margin-bottom:8px;color:var(--fg)}
.card-body{font-size:.88rem;line-height:1.85;color:var(--fg2)}
.card-source{font-family:monospace;font-size:11px;color:var(--muted);margin-top:8px}

/* 指标 */
.metrics{display:flex;gap:2vw;flex-wrap:wrap;margin-bottom:24px}
.metric{flex:1;min-width:90px;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 12px}
.metric-val{font-weight:900;font-size:clamp(1.5rem,3vw,2.2rem);color:var(--accent)}
.metric-label{font-size:11px;color:var(--muted);margin-top:4px;font-family:monospace}

/* 开放问题 */
.oq{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.oq-num{font-weight:900;font-size:1.3rem;color:var(--accent);opacity:.35;margin-bottom:8px}
.oq-text{font-size:.95rem;line-height:1.8;color:var(--fg2)}

/* 引用 */
.quote{font-size:1rem;font-style:italic;line-height:1.8;padding:20px;border-left:3px solid var(--gold);background:rgba(212,168,67,.05);margin:16px 0;color:var(--fg2)}

/* 张力条 */
.tbar{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:.88rem}
.tbar-val{font-family:monospace;font-size:12px;color:var(--accent)}

/* 分割线 */
.divider{border:none;border-top:1px solid var(--border);margin:24px 0}

/* TOC */
.toc-panel{position:fixed;top:0;left:0;width:min(340px,80vw);height:100vh;background:rgba(10,10,15,.97);backdrop-filter:blur(20px);z-index:100;transform:translateX(-100%);transition:transform .35s var(--ease);padding:24px;overflow-y:auto;border-right:1px solid var(--border)}
.toc-panel.open{transform:translateX(0)}
.toc-title{font-family:monospace;font-size:14px;font-weight:700;color:var(--gold);margin-bottom:24px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.toc-item{display:flex;justify-content:space-between;padding:10px 16px;margin-bottom:4px;cursor:pointer;border-radius:6px;border-left:2px solid transparent;font-size:13px;color:var(--fg2);transition:all .2s}
.toc-item:hover{background:var(--card);color:var(--fg)}
.toc-item.active{background:var(--card2);color:var(--accent);border-left-color:var(--accent);font-weight:700}
.toc-label{flex:1}
.toc-page{font-family:monospace;font-size:11px;color:var(--muted)}
.toc-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;opacity:0;pointer-events:none;transition:opacity .3s}
.toc-backdrop.open{opacity:1;pointer-events:auto}

/* 导航栏 */
.nav-bar{position:fixed;bottom:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(10,10,15,.9);backdrop-filter:blur(10px);z-index:50;border-top:1px solid var(--border)}
.nav-left,.nav-right{display:flex;align-items:center;gap:12px}
.nav-btn{background:none;border:1px solid var(--border);color:var(--fg2);padding:8px 16px;border-radius:20px;font-size:12px;cursor:pointer;font-family:monospace;transition:all .2s}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(194,59,34,.1)}
.nav-title{font-size:12px;color:var(--muted);max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-counter{font-family:monospace;font-size:12px;color:var(--muted)}

/* 导航点 */
.nav-dots{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:6px}
.nd{width:6px;height:6px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .3s var(--ease);border:none;padding:0}
.nd.active{background:var(--accent);height:20px;border-radius:3px;box-shadow:0 0 8px var(--accent-glow)}
.nd:hover{background:var(--fg2)}

/* 响应式 */
@media(max-width:1024px){.slide{padding:40px 40px 60px}}
@media(max-width:768px){
  .slide{padding:24px 20px 60px}
  .cover-stats{gap:20px}
  .metrics{flex-direction:column}
  .nav-dots,.nav-title{display:none}
  .nav-bar{padding:0 16px}
}
</style>
</head>
<body>
<div class="deck" id="deck">
<div class="progress-bar" id="progressBar"></div>

<!-- SLIDES_HERE -->

<div class="toc-backdrop" id="tocBackdrop"></div>
<div class="toc-panel" id="tocPanel">
<div class="toc-title">目录</div>
<div id="tocList"></div>
</div>
<div class="nav-bar">
<div class="nav-left">
<button class="nav-btn" id="btnToc">☰ 目录</button>
<button class="nav-btn" id="btnPrev">◀ 上一页</button>
<button class="nav-btn" id="btnNext">下一页 ▶</button>
</div>
<div class="nav-right">
<span class="nav-title" id="slideTitle"></span>
<span class="nav-counter" id="slideCounter"></span>
</div>
</div>
<div class="nav-dots" id="navDots"></div>
</div>

<script>
(function(){
var deck=document.getElementById("deck");
var slides=deck.querySelectorAll(".slide");
var total=slides.length;
var cur=0;
var dots=document.getElementById("navDots");
var tocList=document.getElementById("tocList");
var titleEl=document.getElementById("slideTitle");
var counterEl=document.getElementById("slideCounter");
var tocPanel=document.getElementById("tocPanel");
var tocBackdrop=document.getElementById("tocBackdrop");
var progressBar=document.getElementById("progressBar");

for(var i=0;i<total;i++){
  var d=document.createElement("button");
  d.className="nd";
  d.setAttribute("data-i",i);
  d.onclick=(function(idx){return function(){go(idx)}})(i);
  dots.appendChild(d);
  var t=document.createElement("div");
  t.className="toc-item";
  t.setAttribute("data-i",i);
  t.innerHTML='<span class="toc-label">'+(slides[i].getAttribute("data-title")||"Slide "+(i+1))+'</span><span class="toc-page">'+String(i+1).padStart(2,"0")+'</span>';
  t.onclick=(function(idx){return function(){go(idx);closeTOC()}})(i);
  tocList.appendChild(t);
}

function go(n){
  if(n<0||n>=total)return;
  slides[cur].classList.remove("active");
  dots.children[cur].classList.remove("active");
  tocList.children[cur].classList.remove("active");
  cur=n;
  slides[cur].classList.add("active");
  dots.children[cur].classList.add("active");
  tocList.children[cur].classList.add("active");
  titleEl.textContent=slides[cur].getAttribute("data-title")||"";
  counterEl.textContent=(cur+1)+" / "+total;
  progressBar.style.width=((cur+1)/total*100)+"%";
  slides[cur].scrollTop=0;
}
function toggleTOC(){tocPanel.classList.toggle("open");tocBackdrop.classList.toggle("open")}
function closeTOC(){tocPanel.classList.remove("open");tocBackdrop.classList.remove("open")}

document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"||e.key==="ArrowDown"||e.key===" "||e.key==="PageDown"){e.preventDefault();go(cur+1)}
  else if(e.key==="ArrowLeft"||e.key==="ArrowUp"||e.key==="PageUp"){e.preventDefault();go(cur-1)}
  else if(e.key==="Home"){e.preventDefault();go(0)}
  else if(e.key==="End"){e.preventDefault();go(total-1)}
  else if(e.key==="Escape"){closeTOC();go(0)}
  else if(e.key==="t"||e.key==="T"){toggleTOC()}
});
var wheelTimer=null;
deck.addEventListener("wheel",function(e){e.preventDefault();if(wheelTimer)return;wheelTimer=setTimeout(function(){wheelTimer=null},350);if(e.deltaY>0)go(cur+1);else if(e.deltaY<0)go(cur-1)},{passive:false});
var touchX=0,touchY=0;
deck.addEventListener("touchstart",function(e){touchX=e.touches[0].clientX;touchY=e.touches[0].clientY});
deck.addEventListener("touchend",function(e){
  var dx=touchX-e.changedTouches[0].clientX,dy=touchY-e.changedTouches[0].clientY;
  if(Math.abs(dy)>Math.abs(dx)){if(dy>50)go(cur+1);else if(dy<-50)go(cur-1)}
  else{if(dx>50)go(cur+1);else if(dx<-50)go(cur-1)}
});
deck.addEventListener("click",function(e){
  if(e.target.closest(".nav-btn,.nd,.toc-item,.toc-panel,.toc-backdrop"))return;
  go(cur+1);
});
document.getElementById("btnToc").addEventListener("click",function(e){e.stopPropagation();toggleTOC()});
document.getElementById("btnPrev").addEventListener("click",function(e){e.stopPropagation();go(cur-1)});
document.getElementById("btnNext").addEventListener("click",function(e){e.stopPropagation();go(cur+1)});
tocBackdrop.addEventListener("click",closeTOC);
go(0);
})();
</script>
</body>
</html>
