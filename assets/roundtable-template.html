<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>__BOOK_TITLE__ 圆桌洞见</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#0a0a0b;--paper:#f1efea;--accent:#c9a227;--red:#e94560;--blue:#3498db;--purple:#9b59b6;--orange:#f39c12;--green:#2ecc71;--radius:6px;--ease:cubic-bezier(.25,.46,.45,.94)}
html,body{height:100%;overflow:hidden;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--ink);color:var(--paper)}
.deck{position:relative;width:100vw;height:100vh;overflow:hidden}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:5vh 6vw;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
.slide::-webkit-scrollbar{width:4px}.slide::-webkit-scrollbar-track{background:transparent}.slide::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
.slide.active{display:flex}
.slide.hero{justify-content:center;align-items:center;text-align:center;overflow:hidden}
.slide.title-slide{justify-content:center;align-items:center;text-align:center}
.frame{width:100%;max-width:1000px;margin:0 auto}
.kicker{font-family:monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.45;margin-bottom:2vh}
.h-hero{font-weight:900;font-size:clamp(2.5rem,8vw,5rem);line-height:1.1;margin-bottom:2.5vh}
.h-xl{font-weight:700;font-size:clamp(1.4rem,3.5vw,2.2rem);line-height:1.25;margin-bottom:2vh}
.h-lg{font-weight:700;font-size:clamp(1.1rem,2.5vw,1.6rem);line-height:1.3;margin-bottom:1.5vh}
.h-md{font-weight:600;font-size:clamp(.95rem,1.5vw,1.2rem);margin-bottom:1vh}
.lead{font-weight:300;font-size:clamp(.9rem,1.2vw,1.05rem);line-height:1.85;opacity:.85}
.meta-row{font-family:monospace;font-size:12px;opacity:.45;display:flex;gap:1.5em;flex-wrap:wrap;margin-top:2vh}
.tag{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:600;margin:2px}
.tag-gold{background:rgba(201,162,39,.18);color:#c9a227;border:1px solid rgba(201,162,39,.25)}
.tag-red{background:rgba(192,57,43,.18);color:#e74c3c;border:1px solid rgba(192,57,43,.25)}
.tag-blue{background:rgba(41,128,185,.18);color:#3498db;border:1px solid rgba(41,128,185,.25)}
.tag-purple{background:rgba(142,68,173,.18);color:#9b59b6;border:1px solid rgba(142,68,173,.25)}
.tag-green{background:rgba(39,174,96,.18);color:#2ecc71;border:1px solid rgba(39,174,96,.25)}
.tag-brown{background:rgba(139,69,19,.18);color:#d4a574;border:1px solid rgba(139,69,19,.25)}
.sp{margin-bottom:2.5vh;padding:1.5vh 0;border-bottom:1px solid rgba(255,255,255,.04)}
.sp:last-child{border-bottom:none}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:.8vh}
.sn{font-weight:700;font-size:clamp(.9rem,1.1vw,1rem)}
.sr{font-size:11px;opacity:.4;font-family:monospace}
.st{font-size:clamp(.85rem,1.1vw,1rem);line-height:1.85;opacity:.82;padding-left:.5vw}
.st em{color:var(--accent);font-style:normal;font-weight:600}
.cb{border-radius:var(--radius);padding:2vh 2vw;margin:1.2vh 0;border-left:3px solid var(--red);background:rgba(233,69,96,.06)}
.cb.blue{border-color:var(--blue);background:rgba(52,152,219,.06)}
.cb.purple{border-color:var(--purple);background:rgba(155,89,182,.06)}
.cb.orange{border-color:var(--orange);background:rgba(243,156,18,.06)}
.cb.green{border-color:var(--green);background:rgba(46,204,113,.06)}
.cl{font-family:monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.6vh;color:var(--red)}
.cl.blue{color:var(--blue)}.cl.purple{color:var(--purple)}.cl.orange{color:var(--orange)}.cl.green{color:var(--green)}
.insight-c{text-align:center;max-width:680px;margin:3vh auto;padding:3vh 3vw;background:rgba(201,162,39,.05);border:1px solid rgba(201,162,39,.12);border-radius:var(--radius)}
.insight-q{font-size:1.05rem;font-weight:700;color:var(--accent);line-height:1.6;margin-bottom:1vh}
.insight-a{font-size:.92rem;opacity:.75;line-height:1.75}
.card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);padding:2vh 2.5vw;margin-bottom:1.5vh}
.card-num{font-weight:900;font-size:1.6rem;color:var(--accent);line-height:1;margin-bottom:.5vh;opacity:.5}
.card-title{font-weight:700;font-size:1rem;margin-bottom:.6vh}
.card-body{font-size:.88rem;line-height:1.75;opacity:.78}
.card-source{font-family:monospace;font-size:11px;opacity:.35;margin-top:.8vh}
.metrics{display:flex;gap:2vw;flex-wrap:wrap;margin-bottom:2vh}
.metric{flex:1;min-width:90px;text-align:center;background:rgba(255,255,255,.03);border-radius:var(--radius);padding:2vh 1vw}
.metric-val{font-weight:900;font-size:clamp(1.5rem,3vw,2.2rem);color:var(--accent)}
.metric-label{font-size:11px;opacity:.45;font-family:monospace;margin-top:.3vh}
.oq{background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.08);border-radius:var(--radius);padding:2vh 2.5vw;margin-bottom:1.5vh}
.oq-num{font-weight:900;font-size:1.3rem;color:var(--accent);opacity:.35;margin-bottom:.4vh}
.oq-text{font-size:.95rem;line-height:1.7}
.quote{font-size:clamp(.92rem,1.15vw,1.02rem);font-style:italic;line-height:1.8;padding:2vh 2.5vw;border-left:3px solid var(--accent);background:rgba(201,162,39,.04);margin:2vh 0}
.hyp-step{padding:1vh 1.5vw;border-left:3px solid;margin-bottom:1vh;background:rgba(255,255,255,.02)}
.tbar{display:flex;justify-content:space-between;padding:.7vh 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.88rem}
.tbar-val{font-family:monospace;font-size:12px;color:var(--accent)}
/* TOC */
.toc-panel{position:fixed;top:0;left:0;width:min(340px,80vw);height:100vh;background:rgba(10,10,11,.97);z-index:100;transform:translateX(-100%);transition:transform .35s var(--ease);padding:4vh 3vw;overflow-y:auto;border-right:1px solid rgba(255,255,255,.06)}
.toc-panel.open{transform:translateX(0)}
.toc-title{font-family:monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.4;margin-bottom:3vh}
.toc-item{display:flex;justify-content:space-between;padding:.8vh 0;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04)}
.toc-item:hover .toc-label{opacity:1;color:var(--accent)}
.toc-item.active .toc-label{color:var(--accent);opacity:1;font-weight:600}
.toc-label{font-size:.85rem;opacity:.7;transition:opacity .2s}
.toc-page{font-family:monospace;font-size:11px;opacity:.3}
.toc-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;opacity:0;pointer-events:none;transition:opacity .3s}
.toc-backdrop.open{opacity:1;pointer-events:auto}
/* Nav bar */
.nav-bar{position:fixed;bottom:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 3vw;background:rgba(10,10,11,.85);z-index:50;border-top:1px solid rgba(255,255,255,.05)}
.nav-left,.nav-right{display:flex;align-items:center;gap:12px}
.nav-btn{background:none;border:1px solid rgba(255,255,255,.12);color:var(--paper);padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;font-family:monospace;transition:all .2s;opacity:.6}
.nav-btn:hover{opacity:1;border-color:var(--accent);color:var(--accent)}
.nav-title{font-size:12px;opacity:.5;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-counter{font-family:monospace;font-size:12px;opacity:.4}
/* Dots */
.nav-dots{position:fixed;right:1.5vw;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:6px}
.nd{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.12);cursor:pointer;transition:all .3s var(--ease);border:none;padding:0}
.nd.active{background:var(--accent);height:18px;border-radius:3px}
.nd:hover{background:rgba(255,255,255,.35)}
@media(max-width:1024px){.slide{padding:3vh 5vw}.st{font-size:clamp(.85rem,1.15vw,.98rem)}}
@media(max-width:768px){.slide{padding:3vh 6vw}.st{font-size:.88rem}.h-xl{font-size:clamp(1.2rem,5vw,1.8rem)}.metrics{flex-direction:column}.nav-dots,.nav-title{display:none}}
</style>
</head>
<body>
<div class="deck" id="deck">

<!-- SLIDES_HERE -->

<div class="toc-backdrop" id="tocBackdrop"></div>
<div class="toc-panel" id="tocPanel">
<div class="toc-title">目录</div>
<div id="tocList"></div>
</div>
<div class="nav-bar">
<div class="nav-left">
<button class="nav-btn" id="btnToc">☰ 目录</button>
<button class="nav-btn" id="btnPrev">◀ 上一页</button>
<button class="nav-btn" id="btnNext">下一页 ▶</button>
</div>
<div class="nav-right">
<span class="nav-title" id="slideTitle"></span>
<span class="nav-counter" id="slideCounter"></span>
</div>
</div>
<div class="nav-dots" id="navDots"></div>
</div>

<script>
(function(){
var deck=document.getElementById("deck");
var slides=deck.querySelectorAll(".slide");
var total=slides.length;
var cur=0;
var dots=document.getElementById("navDots");
var tocList=document.getElementById("tocList");
var titleEl=document.getElementById("slideTitle");
var counterEl=document.getElementById("slideCounter");
var tocPanel=document.getElementById("tocPanel");
var tocBackdrop=document.getElementById("tocBackdrop");

for(var i=0;i<total;i++){
  var d=document.createElement("button");
  d.className="nd";
  d.setAttribute("data-i",i);
  d.onclick=(function(idx){return function(){go(idx)}})(i);
  dots.appendChild(d);
  var t=document.createElement("div");
  t.className="toc-item";
  t.setAttribute("data-i",i);
  t.innerHTML='<span class="toc-label">'+(slides[i].getAttribute("data-title")||"Slide "+(i+1))+'</span><span class="toc-page">'+String(i+1).padStart(2,"0")+'</span>';
  t.onclick=(function(idx){return function(){go(idx);closeTOC()}})(i);
  tocList.appendChild(t);
}

function go(n){
  if(n<0||n>=total)return;
  slides[cur].classList.remove("active");
  dots.children[cur].classList.remove("active");
  tocList.children[cur].classList.remove("active");
  cur=n;
  slides[cur].classList.add("active");
  dots.children[cur].classList.add("active");
  tocList.children[cur].classList.add("active");
  titleEl.textContent=slides[cur].getAttribute("data-title")||"";
  counterEl.textContent=(cur+1)+" / "+total;
  slides[cur].scrollTop=0;
}
function toggleTOC(){tocPanel.classList.toggle("open");tocBackdrop.classList.toggle("open")}
function closeTOC(){tocPanel.classList.remove("open");tocBackdrop.classList.remove("open")}

document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"||e.key==="ArrowDown"||e.key===" "||e.key==="PageDown"){e.preventDefault();go(cur+1)}
  else if(e.key==="ArrowLeft"||e.key==="ArrowUp"||e.key==="PageUp"){e.preventDefault();go(cur-1)}
  else if(e.key==="Home"){e.preventDefault();go(0)}
  else if(e.key==="End"){e.preventDefault();go(total-1)}
  else if(e.key==="Escape"){closeTOC();go(0)}
  else if(e.key==="t"||e.key==="T"){toggleTOC()}
});
var wheelTimer=null;
deck.addEventListener("wheel",function(e){e.preventDefault();if(wheelTimer)return;wheelTimer=setTimeout(function(){wheelTimer=null},350);if(e.deltaY>0)go(cur+1);else if(e.deltaY<0)go(cur-1)},{passive:false});
var touchX=0,touchY=0;
deck.addEventListener("touchstart",function(e){touchX=e.touches[0].clientX;touchY=e.touches[0].clientY});
deck.addEventListener("touchend",function(e){
  var dx=touchX-e.changedTouches[0].clientX,dy=touchY-e.changedTouches[0].clientY;
  if(Math.abs(dy)>Math.abs(dx)){if(dy>50)go(cur+1);else if(dy<-50)go(cur-1)}
  else{if(dx>50)go(cur+1);else if(dx<-50)go(cur-1)}
});
deck.addEventListener("click",function(e){
  if(e.target.closest(".nav-btn,.nd,.toc-item,.toc-panel,.toc-backdrop"))return;
  go(cur+1);
});
document.getElementById("btnToc").addEventListener("click",function(e){e.stopPropagation();toggleTOC()});
document.getElementById("btnPrev").addEventListener("click",function(e){e.stopPropagation();go(cur-1)});
document.getElementById("btnNext").addEventListener("click",function(e){e.stopPropagation();go(cur+1)});
tocBackdrop.addEventListener("click",closeTOC);
go(0);
})();
</script>
</body>
</html>
