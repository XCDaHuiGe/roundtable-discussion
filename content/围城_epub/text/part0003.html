<h1 id="a004" class="front">文前辅文</h1>
<p class="calibre1">围在城里的人想逃出来，</p>
<p class="calibre1">城外的人想冲进去，</p>
<p class="calibre1">对婚姻也罢，职业也罢，</p>
<p class="calibre1">人生的愿望大都如此。</p>
