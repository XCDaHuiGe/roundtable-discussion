<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --bg-subtle: #fafbfc;
  --bg-card: rgba(255,255,255,0.92);
  --text: #0f1419;
  --text-secondary: #536471;
  --text-muted: #8899a6;
  --gray-50: #f7f9fa;
  --gray-100: #eff3f4;
  --gray-200: #d9e1e4;
  --gray-300: #c4ccd0;
  --gray-400: #8899a6;
  --accent: #00ba7c;
  --accent-dark: #009668;
  --accent-light: rgba(0,186,124,0.08);
  --accent-glow: rgba(0,186,124,0.15);
  --green: #00ba7c;
  --green-light: rgba(0,186,124,0.06);
  --green-dark: #009668;
  --red: #f4212e;
  --red-light: rgba(244,33,46,0.06);
  --red-dark: #c44536;
  --serif: 'Noto Serif SC', Georgia, 'Times New Roman', serif;
  --sans: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { overflow: hidden; scroll-behavior: smooth; }
body {
  background: var(--bg);
  font-family: var(--sans);
  color: var(--text);
  overflow-x: hidden;
  overflow:hidden;
  scroll-snap-type: y mandatory;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.slide {
  height: 100vh;
  overflow:hidden;
  scroll-snap-align: start;
  display: flex;
  flex-direction: column;
  padding: 72px 96px;
  position: relative;
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}
.slide::before {
  content: '';
  position: absolute;
  inset: 0;
  background: 
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0,186,124,0.04) 0%, transparent 50%),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(0,186,124,0.02) 0%, transparent 40%);
  pointer-events: none;
  z-index: 0;
}
.slide.visible {
  opacity: 1;
  transform: translateY(0);
}
.slide-cover {
  justify-content: center;
  align-items: center;
  text-align: center;
  background: 
    linear-gradient(135deg, rgba(0,186,124,0.02) 0%, transparent 50%),
    linear-gradient(225deg, rgba(0,186,124,0.015) 0%, transparent 50%),
    var(--bg);
}
.slide-white { background: var(--bg); position: relative; }
.cover {
  max-width: 880px;
  margin: 0 auto;
  position: relative;
  z-index: 2;
}
.cover-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 28px;
  background: var(--accent-light);
  border: 1.5px solid var(--accent);
  border-radius: 100px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 48px;
  font-weight: 600;
  color: var(--accent-dark);
  animation: fadeInDown 0.8s ease forwards;
  animation-delay: 0.1s;
  opacity: 0;
}
@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}
.cover-title {
  font-family: var(--serif);
  font-size: clamp(52px, 9vw, 108px);
  font-weight: 900;
  line-height: 1.02;
  margin-bottom: 28px;
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, var(--text) 0%, var(--text-secondary) 50%, var(--accent-dark) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: fadeInUp 1s ease forwards;
  animation-delay: 0.2s;
  opacity: 0;
}
.cover-sub {
  font-size: 19px;
  color: var(--text-secondary);
  line-height: 1.85;
  margin-bottom: 64px;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
  font-weight: 400;
  letter-spacing: 0.01em;
  animation: fadeInUp 1s ease forwards;
  animation-delay: 0.35s;
  opacity: 0;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
.cover-stats {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 0;
  margin-bottom: 56px;
  animation: fadeInUp 1s ease forwards;
  animation-delay: 0.5s;
  opacity: 0;
}
.cover-stat {
  text-align: center;
  padding: 0 40px;
  position: relative;
}
.cover-stat:not(:last-child)::after {
  content: '';
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 1px;
  height: 48px;
  background: linear-gradient(180deg, transparent 0%, var(--gray-200) 50%, transparent 100%);
}
.cover-stat-num {
  font-family: var(--serif);
  font-size: 64px;
  font-weight: 900;
  line-height: 1;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.cover-stat-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-top: 12px;
  font-weight: 500;
}
.experts-section {
  position: relative;
  z-index: 2;
  max-width: 960px;
  margin: 0 auto;
  width: 100%;
}
.section-header {
  margin-bottom: 40px;
  animation: fadeInUp 0.8s ease forwards;
  animation-delay: 0.1s;
  opacity: 0;
}
.section-tag {
  display: inline-block;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 12px;
  padding: 6px 14px;
  background: var(--accent-light);
  border-radius: 4px;
}
.section-title {
  font-family: var(--serif);
  font-size: 36px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text);
}
.experts-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}
.expert-card {
  background: var(--bg-card);
  border-radius: 20px;
  padding: 32px 24px;
  text-align: center;
  backdrop-filter: blur(12px);
  border: 1px solid var(--gray-100);
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
}
.expert-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--accent-dark) 100%);
  opacity: 0;
  transition: opacity 0.3s ease;
}
.expert-card:hover {
  transform: translateY(-8px);
  box-shadow: 
    0 20px 60px rgba(0,186,124,0.12),
    0 8px 24px rgba(0,0,0,0.04);
  border-color: var(--accent-light);
}
.expert-card:hover::before {
  opacity: 1;
}
.expert-card:nth-child(1) { animation: fadeInUp 0.6s ease forwards; animation-delay: 0.15s; opacity: 0; }
.expert-card:nth-child(2) { animation: fadeInUp 0.6s ease forwards; animation-delay: 0.25s; opacity: 0; }
.expert-card:nth-child(3) { animation: fadeInUp 0.6s ease forwards; animation-delay: 0.35s; opacity: 0; }
.expert-card:nth-child(4) { animation: fadeInUp 0.6s ease forwards; animation-delay: 0.45s; opacity: 0; }
.expert-card:nth-child(5) { animation: fadeInUp 0.6s ease forwards; animation-delay: 0.55s; opacity: 0; }
.expert-card:nth-child(6) { animation: fadeInUp 0.6s ease forwards; animation-delay: 0.65s; opacity: 0; }
.expert-avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: 800;
  color: white;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
  box-shadow: 0 8px 24px rgba(0,186,124,0.25);
  transition: all 0.4s ease;
  position: relative;
}
.expert-avatar::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 2px solid transparent;
  background: linear-gradient(135deg, var(--accent) 0%, transparent 50%) border-box;
  -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
  mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.expert-card:hover .expert-avatar {
  transform: scale(1.05);
  box-shadow: 0 12px 32px rgba(0,186,124,0.35);
}
.expert-card:hover .expert-avatar::after {
  opacity: 1;
}
.expert-card:nth-child(2) .expert-avatar { background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 8px 24px rgba(16,185,129,0.25); }
.expert-card:nth-child(3) .expert-avatar { background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%); box-shadow: 0 8px 24px rgba(20,184,166,0.25); }
.expert-card:nth-child(4) .expert-avatar { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); box-shadow: 0 8px 24px rgba(34,197,94,0.25); }
.expert-card:nth-child(5) .expert-avatar { background: linear-gradient(135deg, #84cc16 0%, #65a30d 100%); box-shadow: 0 8px 24px rgba(132,204,22,0.25); }
.expert-card:nth-child(6) .expert-avatar { background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); box-shadow: 0 8px 24px rgba(6,182,212,0.25); }
.expert-name { font-weight: 700; font-size: 17px; margin-bottom: 6px; color: var(--text); letter-spacing: -0.01em; }
.expert-role { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
.round-section {
  position: relative;
  z-index: 2;
  max-width: 920px;
  margin: 0 auto;
  width: 100%;
}
.round-card {
  background: var(--bg-card);
  border-radius: 24px;
  padding: 40px 44px;
  margin-bottom: 28px;
  backdrop-filter: blur(12px);
  border: 1px solid var(--gray-100);
  position: relative;
  overflow: hidden;
  animation: fadeInUp 0.8s ease forwards;
  animation-delay: 0.1s;
  opacity: 0;
}
.round-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--accent-dark) 50%, var(--accent) 100%);
}
.round-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 16px;
  padding: 6px 12px;
  background: var(--accent-light);
  border-radius: 4px;
}
.round-question {
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 700;
  line-height: 1.5;
  margin-bottom: 32px;
  color: var(--text);
  letter-spacing: -0.01em;
}
.review-card {
  background: white;
  border-radius: 16px;
  padding: 28px 32px;
  margin-bottom: 18px;
  border: 1px solid var(--gray-100);
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
}
.review-card:hover {
  box-shadow: 
    0 12px 40px rgba(0,186,124,0.08),
    0 4px 12px rgba(0,0,0,0.02);
  border-color: var(--gray-200);
  transform: translateX(4px);
}
.review-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 16px;
}
.review-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 18px;
  flex-shrink: 0;
}
.review-meta { flex: 1; }
.review-name { font-weight: 700; font-size: 16px; color: var(--text); letter-spacing: -0.01em; }
.review-role { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.review-content {
  font-size: 15px;
  line-height: 1.9;
  color: var(--text-secondary);
  letter-spacing: 0.01em;
}
.review-content strong {
  color: var(--text);
  font-weight: 600;
}
.clash-block {
  background: var(--red-light);
  border-left: 4px solid var(--red-dark);
  border-radius: 0 16px 16px 0;
  padding: 28px 32px;
  margin: 24px 0;
  position: relative;
  box-shadow: 
    inset 4px 0 16px rgba(244,33,46,0.04),
    0 4px 16px rgba(244,33,46,0.06);
}
.clash-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.clash-label::before {
  content: '';
  width: 8px;
  height: 8px;
  background: var(--red);
  border-radius: 50%;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.clash-text {
  font-size: 15px;
  line-height: 1.85;
  color: var(--text);
  letter-spacing: 0.01em;
}
.insight-card {
  background: var(--green-light);
  border-left: 4px solid var(--green-dark);
  border-radius: 0 16px 16px 0;
  padding: 28px 32px;
  margin-top: 28px;
  position: relative;
  box-shadow: 
    inset 4px 0 16px rgba(0,186,124,0.04),
    0 4px 16px rgba(0,186,124,0.06);
}
.insight-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--green-dark);
  margin-bottom: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.insight-label::before {
  content: '✦';
  font-size: 12px;
}
.insight-text {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 700;
  line-height: 1.65;
  color: var(--text);
  letter-spacing: -0.01em;
}
.conclusions-section {
  position: relative;
  z-index: 2;
  max-width: 920px;
  margin: 0 auto;
  width: 100%;
}
.conclusions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
  margin-top: 48px;
}
.conclusion-item {
  padding: 36px;
  border: 1px solid var(--gray-100);
  border-radius: 20px;
  background: white;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
  animation: fadeInUp 0.6s ease forwards;
  opacity: 0;
}
.conclusion-item:nth-child(1) { animation-delay: 0.1s; }
.conclusion-item:nth-child(2) { animation-delay: 0.2s; }
.conclusion-item:nth-child(3) { animation-delay: 0.3s; }
.conclusion-item:nth-child(4) { animation-delay: 0.4s; }
.conclusion-item::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--accent-dark) 100%);
  opacity: 0;
  transition: opacity 0.3s ease;
}
.conclusion-item:hover {
  transform: translateY(-6px);
  box-shadow: 
    0 16px 48px rgba(0,186,124,0.1),
    0 6px 16px rgba(0,0,0,0.03);
  border-color: var(--gray-200);
}
.conclusion-item:hover::before {
  opacity: 1;
}
.conclusion-num {
  font-family: var(--serif);
  font-size: 56px;
  font-weight: 900;
  color: var(--gray-100);
  margin-bottom: 16px;
  line-height: 1;
  letter-spacing: -0.02em;
}
.conclusion-text {
  font-size: 15px;
  line-height: 1.85;
  color: var(--text-secondary);
  letter-spacing: 0.01em;
}
.conclusion-text strong {
  font-weight: 700;
  color: var(--text);
  font-size: 17px;
  letter-spacing: -0.01em;
}
.question-card {
  background: var(--bg-card);
  border-radius: 18px;
  padding: 28px 32px;
  margin-bottom: 18px;
  cursor: pointer;
  border: 1px solid var(--gray-100);
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  animation: fadeInUp 0.6s ease forwards;
  opacity: 0;
}
.question-card:nth-child(1) { animation-delay: 0.1s; }
.question-card:nth-child(2) { animation-delay: 0.2s; }
.question-card:nth-child(3) { animation-delay: 0.3s; }
.question-card:nth-child(4) { animation-delay: 0.4s; }
.question-card:nth-child(5) { animation-delay: 0.5s; }
.question-card:hover {
  background: white;
  box-shadow: 
    0 12px 40px rgba(0,186,124,0.1),
    0 4px 12px rgba(0,0,0,0.02);
  border-color: var(--accent);
}
.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.question-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
}
.question-icon {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--accent-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: var(--accent);
  transition: all 0.3s ease;
  flex-shrink: 0;
}
.question-card:hover .question-icon {
  transform: rotate(90deg);
  background: var(--accent);
  color: white;
}
.question-answer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s cubic-bezier(0.16, 1, 0.3, 1), padding 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  font-size: 15px;
  line-height: 1.9;
  color: var(--text-secondary);
  letter-spacing: 0.01em;
}
.question-card:hover .question-answer {
  max-height: 300px;
  padding-top: 20px;
}
.final-conclusion {
  max-width: 800px;
  margin: 0 auto;
  text-align: center;
  animation: fadeInUp 0.8s ease forwards;
  animation-delay: 0.2s;
  opacity: 0;
}
.final-conclusion-text {
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 700;
  line-height: 1.65;
  color: var(--text);
  letter-spacing: -0.01em;
  padding: 48px;
  background: var(--bg-card);
  border-radius: 24px;
  border: 1px solid var(--gray-100);
  position: relative;
}
.final-conclusion-text::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
  height: 4px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--accent-dark) 100%);
  border-radius: 2px;
}
#nav {
  position: fixed;
  bottom: 36px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 18px;
  z-index: 100;
  background: rgba(255,255,255,0.96);
  padding: 14px 28px;
  border-radius: 100px;
  box-shadow: 
    0 8px 32px rgba(0,0,0,0.08),
    0 2px 8px rgba(0,0,0,0.04);
  backdrop-filter: blur(20px);
  border: 1px solid var(--gray-100);
}
.nav-btn {
  width: 44px;
  height: 44px;
  border: none;
  background: var(--gray-50);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: var(--text-secondary);
  border-radius: 50%;
  transition: all 0.25s ease;
}
.nav-btn:hover {
  background: var(--accent);
  color: white;
  transform: scale(1.05);
}
.dots { display: flex; gap: 8px; }
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gray-200);
  cursor: pointer;
  transition: all 0.3s ease;
}
.dot:hover { background: var(--gray-300); }
.dot.active {
  background: var(--accent);
  width: 28px;
  border-radius: 4px;
}
#counter {
  position: fixed;
  top: 32px;
  right: 40px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-muted);
  z-index: 100;
  font-weight: 500;
  letter-spacing: 0.08em;
  background: rgba(255,255,255,0.9);
  padding: 8px 16px;
  border-radius: 100px;
  backdrop-filter: blur(10px);
}
#progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--accent-dark) 100%);
  width: 0;
  z-index: 1000;
  transition: width 0.35s ease;
  box-shadow: 0 0 12px rgba(0,186,124,0.4);
}
@media (max-width: 1024px) {
  .slide { padding: 56px 64px; }
  .experts-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .conclusions { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  .slide { padding: 40px 28px; }
  .cover-title { font-size: 44px; }
  .cover-stats { gap: 0; flex-wrap: wrap; }
  .cover-stat { padding: 0 24px; }
  .cover-stat-num { font-size: 48px; }
  .experts-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .section-title { font-size: 28px; }
  .round-card { padding: 28px 24px; }
  .round-question { font-size: 22px; }
  .review-card { padding: 20px 24px; }
  .conclusion-item { padding: 28px; }
  #nav { padding: 12px 20px; gap: 14px; }
  #counter { top: 20px; right: 24px; }
}
@media (max-width: 480px) {
  .experts-grid { grid-template-columns: 1fr; }
  .cover-stats { flex-direction: column; gap: 24px; }
  .cover-stat:not(:last-child)::after { display: none; }
  .conclusions { gap: 16px; }
}
</style>
</head>
<body>
<div id="progress" style="width: 0%;"></div>
<div class="frame">
  <div class="inner">
    <div class="slides">
{{slides}}
    </div>
  </div>
</div>
<div id="nav">
  <button class="nav-btn" id="prevBtn">◀</button>
  <div class="dots" id="dots"></div>
  <button class="nav-btn" id="nextBtn">▶</button>
</div>
<div id="counter">1 / 1</div>


<script>
(function(){
  const slides=document.querySelectorAll('.slide');
  const total=slides.length;
  let cur=0;
  const dotsContainer=document.getElementById('dots');
  const counter=document.getElementById('counter');
  const progress=document.getElementById('progressBar');
  const isHorizontal=document.body.style.flexDirection==='row'||document.documentElement.style.scrollSnapType?.includes('x');

  slides.forEach((s,i)=>{
    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' active':'');
    dot.onclick=()=>go(i);
    dotsContainer.appendChild(dot);
  });

  function go(n){
    if(n<0||n>=total)return;
    slides[cur].classList.remove('visible');
    dotsContainer.children[cur]?.classList.remove('active');
    cur=n;
    slides[cur].scrollIntoView({behavior:'smooth',block:'start',inline:'start'});
    slides[cur].classList.add('visible');
    dotsContainer.children[cur]?.classList.add('active');
    if(counter)counter.textContent=(cur+1)+' / '+total;
    if(progress){const pct=Math.min(100,((cur+1)/total)*100);progress.style.width=pct+'%';}
  }

  document.getElementById('prevBtn')?.addEventListener('click',()=>go(cur-1));
  document.getElementById('nextBtn')?.addEventListener('click',()=>go(cur+1));

  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){
      e.preventDefault();go(cur+1);
    }else if(e.key==='ArrowUp'||e.key==='ArrowLeft'||e.key==='PageUp'){
      e.preventDefault();go(cur-1);
    }else if(e.key==='Home'){
      e.preventDefault();go(0);
    }else if(e.key==='End'){
      e.preventDefault();go(total-1);
    }
  });

  let wheelTimer=null;
  document.addEventListener('wheel',e=>{
    e.preventDefault();
    if(wheelTimer)return;
    wheelTimer=setTimeout(()=>wheelTimer=null,400);
    if(e.deltaY>0)go(cur+1);
    else if(e.deltaY<0)go(cur-1);
  },{passive:false});

  document.body.addEventListener('click',e=>{
    if(e.target.closest('.nav-dot,.dots,.nav-btn,.expert-card,.speech-card,.clash-block,.insight-block,.question-card,.conclusion-item,.stat-item,.card'))return;
    go(cur+1);
  });

  go(0);
})();
</script>
</body>
</html>
