<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1B2A4A;
  --dark-navy: #151F35;
  --cyan: #00A9F4;
  --light-cyan: #4FC3F7;
  --black: #000000;
  --text: #1A1A1A;
  --gray-600: #555555;
  --gray-400: #999999;
  --gray-200: #E0E0E0;
  --gray-100: #F5F5F5;
  --white: #FFFFFF;
  --green: #4CAF50;
  --amber: #FFC107;
  --red: #E53935;
  --font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', Georgia, serif;
  --font-sans: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --font-num: Georgia, 'Times New Roman', serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scroll-behavior: smooth; }
body { display: flex; flex-direction: row; width: max-content; height: 100vh; background: #fff; color: var(--text); font-family: var(--font-sans); }
.slide { width: 100vw; height: 100vh; min-width: 100vw; position: relative; display: flex; flex-direction: column; scroll-snap-align: start; }
.slide-cover { background: var(--navy); background-image: repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(255,255,255,0.03) 59px, rgba(255,255,255,0.03) 60px), repeating-linear-gradient(0deg, transparent, transparent 59px, rgba(255,255,255,0.03) 59px, rgba(255,255,255,0.03) 60px); color: var(--white); padding: clamp(36px, 5vh, 60px) clamp(40px, 5vw, 80px); justify-content: space-between; }
.cover-logo { font-family: var(--font-serif); font-size: clamp(17px, 2vw, 26px); font-weight: 500; letter-spacing: 0.04em; }
.cover-logo span { display: block; padding-left: 1em; font-weight: 400; color: rgba(255,255,255,0.8); }
.cover-body { max-width: 65%; }
.cover-body h1 { font-family: var(--font-serif); font-size: clamp(34px, 4.6vw, 64px); font-weight: 700; line-height: 1.15; margin-bottom: clamp(12px, 2vh, 24px); letter-spacing: 0.02em; }
.cover-body .cover-sub { font-family: var(--font-serif); font-size: clamp(15px, 1.8vw, 24px); font-weight: 400; margin-bottom: clamp(4px, 1vh, 12px); color: rgba(255,255,255,0.85); }
.cover-body .cover-date { font-size: clamp(12px, 1.3vw, 16px); color: rgba(255,255,255,0.6); }
.cover-footer { font-size: clamp(10px, 0.95vw, 12px); color: rgba(255,255,255,0.5); letter-spacing: 0.08em; }
.slide-white { background: var(--white); padding: clamp(20px, 3vh, 36px) clamp(32px, 4vw, 64px); }
.breadcrumb { font-size: clamp(10px, 0.9vw, 12px); color: var(--gray-400); text-align: right; margin-bottom: clamp(8px, 1.2vh, 16px); }
.slide-title { font-family: var(--font-serif); font-size: clamp(17px, 2.1vw, 28px); font-weight: 700; color: var(--black); line-height: 1.45; margin-bottom: clamp(10px, 1.5vh, 18px); }
.experts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 24px; }
.expert-card { background: var(--gray-100); border-radius: 8px; padding: 20px; }
.expert-avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--navy); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; margin-bottom: 12px; }
.expert-name { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
.expert-role { font-size: 12px; color: var(--gray-400); margin-bottom: 8px; }
.expert-desc { font-size: 13px; color: var(--gray-600); line-height: 1.5; }
.speech-cards { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
.speech-card { background: var(--gray-100); border-radius: 8px; padding: 20px; border-left: 4px solid var(--navy); }
.speech-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.speaker-avatar { width: 40px; height: 40px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
.speaker-name { font-weight: 700; font-size: 14px; }
.speaker-role { font-size: 11px; color: var(--gray-400); }
.speech-content { font-size: 14px; line-height: 1.7; color: var(--gray-600); }
.clash-block { background: rgba(229,57,53,0.05); border: 1px solid rgba(229,57,53,0.2); border-radius: 8px; padding: 20px; margin-top: 16px; }
.clash-item { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid rgba(0,0,0,0.05); }
.clash-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
.clash-speaker { font-weight: 700; font-size: 13px; color: var(--red); margin-bottom: 4px; }
.clash-text { font-size: 13px; line-height: 1.6; color: var(--gray-600); }
.insight-block { background: linear-gradient(135deg, rgba(76,175,80,0.1), rgba(76,175,80,0.05)); border: 1px solid var(--green); border-radius: 8px; padding: 24px; margin-top: 16px; }
.insight-q { font-family: var(--font-serif); font-size: 16px; font-weight: 700; color: var(--green); margin-bottom: 12px; }
.insight-a { font-size: 14px; line-height: 1.7; color: var(--gray-600); }
.conclusions-grid { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
.conclusion-item { display: flex; gap: 16px; align-items: flex-start; }
.conclusion-num { font-family: var(--font-num); font-size: 32px; font-weight: 700; color: var(--navy); opacity: 0.3; line-height: 1; }
.conclusion-text { font-size: 15px; line-height: 1.6; color: var(--text); flex: 1; }
#nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; z-index: 100; background: rgba(0,0,0,0.8); padding: 8px 16px; border-radius: 20px; }
.nav-btn { width: 32px; height: 32px; border: none; background: var(--gray-200); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: background 0.2s; }
.nav-btn:hover { background: var(--gray-400); }
.dots { display: flex; gap: 4px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; }
.dot.active { background: white; }
#counter { position: fixed; top: 16px; right: 20px; font-size: 11px; color: rgba(255,255,255,0.6); z-index: 100; }
</style>
</head>
<body>
{{slides}}
<div id="nav">
  <button class="nav-btn" id="prevBtn">◀</button>
  <div class="dots" id="dots"></div>
  <button class="nav-btn" id="nextBtn">▶</button>
</div>
<div id="counter" class="slide-cover" style="position:fixed;top:16px;right:20px;padding:4px 12px;border-radius:12px;font-size:11px;">1 / 1</div>
<script>
(function(){
  const slides = document.querySelectorAll('.slide');
  const total = slides.length;
  let cur = 0;
  const dotsContainer = document.getElementById('dots');
  const counter = document.getElementById('counter');
  
  slides.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.onclick = () => go(i);
    dotsContainer.appendChild(dot);
  });
  
  function go(n) {
    if (n < 0 || n >= total) return;
    slides[cur].style.display = 'none';
    dotsContainer.children[cur].classList.remove('active');
    cur = n;
    slides[cur].style.display = 'flex';
    dotsContainer.children[cur].classList.add('active');
    counter.textContent = (cur + 1) + ' / ' + total;
  }
  
  document.getElementById('prevBtn').onclick = () => go(cur - 1);
  document.getElementById('nextBtn').onclick = () => go(cur + 1);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') go(cur + 1);
    else if (e.key === 'ArrowLeft') go(cur - 1);
  });
  
  go(0);
})();
</script>
</body>
</html>
