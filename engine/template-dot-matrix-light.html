<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<style>
:root {
  --bg: #deded9;
  --sand: #7d796f;
  --stone: #22211f;
  --paper: #fbfaf6;
  --ink: #24221f;
  --muted: rgba(36,34,31,0.66);
  --quiet: rgba(36,34,31,0.28);
  --cyan: #3e4744;
  --green: #716d62;
  --amber: #1f1e1b;
  --line: rgba(36,34,31,0.18);
  --surface: rgba(246,244,239,0.58);
  --mono: Georgia, monospace;
  --sans: 'PingFang SC', 'Noto Sans SC', sans-serif;
  --serif: 'Songti SC', 'Noto Serif CJK SC', serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; }
body { display: flex; width: max-content; height: 100vh; background: var(--bg); font-family: var(--sans); color: var(--ink); }
.slide { width: 100vw; height: 100vh; min-width: 100vw; scroll-snap-align: start; display: flex; flex-direction: column; position: relative; background: radial-gradient(circle at 72% 36%, rgba(142,150,148,0.16), transparent 18%), radial-gradient(circle at 50% 112%, rgba(120,115,106,0.13), transparent 34%), var(--bg); }
.slide-cover { justify-content: center; align-items: center; text-align: center; }
.slide-light { padding: 48px 64px; }
.frame { max-width: 760px; margin: 0 auto; width: 100%; }
.dot-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); margin-bottom: 32px; }
.dot-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--quiet); }
.dot-title { font-family: var(--serif); font-size: 13px; font-weight: 600; }
.wave-block { background: var(--surface); padding: 24px; margin-bottom: 16px; border-left: 3px solid var(--cyan); }
.wave-meta { display: flex; justify-content: space-between; margin-bottom: 12px; }
.wave-speaker { font-weight: 700; font-size: 14px; color: var(--cyan); }
.wave-tag { font-family: var(--mono); font-size: 10px; padding: 4px 8px; background: var(--line); color: var(--muted); }
.wave-content { font-size: 14px; line-height: 1.8; color: var(--ink); }
.signal-insight { background: linear-gradient(135deg, rgba(62,71,68,0.12), transparent); border: 1px solid var(--green); padding: 24px; margin-top: 16px; }
.insight-header { font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--green); margin-bottom: 12px; }
.insight-text { font-size: 15px; line-height: 1.7; }
#nav { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; z-index: 100; background: var(--paper); padding: 8px 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
.nav-btn { width: 32px; height: 32px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }
.nav-btn:hover { background: var(--paper); }
.dots { display: flex; gap: 4px; }
.dot { width: 6px; height: 6px; border-radius: 0; background: var(--quiet); cursor: pointer; }
.dot.active { background: var(--cyan); }
#counter { position: fixed; top: 20px; right: 24px; font-family: var(--mono); font-size: 10px; color: var(--quiet); z-index: 100; }
</style>
</head>
<body>
{{slides}}
<div id="nav">
  <button class="nav-btn" id="prevBtn">◀</button>
  <div class="dots" id="dots"></div>
  <button class="nav-btn" id="nextBtn">▶</button>
</div>
<div id="counter">1 / 1</div>
<script>
(function(){
  const slides = document.querySelectorAll('.slide');
  const total = slides.length;
  let cur = 0;
  const dots = document.getElementById('dots');
  const counter = document.getElementById('counter');
  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.onclick = () => go(i);
    dots.appendChild(d);
  });
  function go(n) {
    if (n < 0 || n >= total) return;
    slides[cur].style.display = 'none';
    dots.children[cur].classList.remove('active');
    cur = n;
    slides[cur].style.display = 'flex';
    dots.children[cur].classList.add('active');
    counter.textContent = (cur + 1) + ' / ' + total;
  }
  document.getElementById('prevBtn').onclick = () => go(cur - 1);
  document.getElementById('nextBtn').onclick = () => go(cur + 1);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') go(cur + 1);
    else if (e.key === 'ArrowLeft') go(cur - 1);
  });
  go(0);
})();
</script>
</body>
</html>
