<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f4f0;
  --surface: rgba(255, 255, 255, 0.72);
  --surface-elevated: rgba(255, 255, 255, 0.92);
  --dot: #d8d6d0;
  --text: #1a1918;
  --dim: #6b6966;
  --accent: #3e4744;
  --signal: #716d62;
  --clash-red: #c44536;
  --insight-green: #2d6a4f;
  --glow: rgba(62, 71, 68, 0.08);
  --mono: 'JetBrains Mono', 'SF Mono', monospace;
  --serif: 'Noto Serif SC', serif;
  --sans: 'Outfit', -apple-system, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { overflow: hidden; scroll-behavior: smooth; }
body {
  display: flex;
  flex-direction: column;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: var(--bg);
  font-family: var(--sans);
  color: var(--text);
  opacity: 0;
  animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  position: relative;
}
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: 
    radial-gradient(ellipse 80% 50% at 20% 40%, rgba(62, 71, 68, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse 60% 40% at 80% 60%, rgba(113, 109, 98, 0.05) 0%, transparent 50%),
    radial-gradient(ellipse 40% 30% at 50% 80%, rgba(45, 106, 79, 0.04) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  opacity: 0.02;
  pointer-events: none;
  z-index: 0;
}
@keyframes fadeIn { to { opacity: 1; } }
@keyframes slideUp { 
  from { opacity: 0; transform: translateY(50px); } 
  to { opacity: 1; transform: translateY(0); } 
}
@keyframes scaleIn { 
  from { opacity: 0; transform: scale(0.92); } 
  to { opacity: 1; transform: scale(1); } 
}
@keyframes shimmer {
  0% { background-position: -200% center; }
  100% { background-position: 200% center; }
}
@keyframes glowRing {
  0%, 100% { box-shadow: 0 0 0 0 rgba(62, 71, 68, 0.2); }
  50% { box-shadow: 0 0 0 8px rgba(62, 71, 68, 0.1); }
}
.sections { flex: 1; overflow: hidden; position: relative; z-index: 1; }
.section,.slide {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1px);
  background-size: 32px 32px;
  overflow: hidden;
}
.section.visible,.slide.visible { opacity: 1; pointer-events: auto; }
.section.visible .animate-in,.slide.visible .animate-in { animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
.section.visible .animate-scale,.slide.visible .animate-scale { animation: scaleIn 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
.section.visible .delay-1,.slide.visible .delay-1 { animation-delay: 0.1s; opacity: 0; }
.section.visible .delay-2,.slide.visible .delay-2 { animation-delay: 0.2s; opacity: 0; }
.section.visible .delay-3,.slide.visible .delay-3 { animation-delay: 0.35s; opacity: 0; }
.section.visible .delay-4,.slide.visible .delay-4 { animation-delay: 0.5s; opacity: 0; }
.section.visible .delay-5,.slide.visible .delay-5 { animation-delay: 0.65s; opacity: 0; }
.section-cover { justify-content: center; align-items: center; text-align: center; padding: 48px; }
.section-round { padding: 64px 72px; overflow: hidden; }
.section-round::-webkit-scrollbar { width: 4px; }
.section-round::-webkit-scrollbar-track { background: transparent; }
.section-round::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }
.frame { max-width: 920px; margin: 0 auto; width: 100%; }
.main-title {
  font-family: var(--sans);
  font-size: clamp(52px, 11vw, 108px);
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1.05;
  margin-bottom: 28px;
  background: linear-gradient(135deg, var(--text) 0%, var(--accent) 50%, var(--signal) 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 8s linear infinite;
}
.subtitle {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 400;
  color: var(--dim);
  margin-bottom: 56px;
  letter-spacing: 0.03em;
  line-height: 1.7;
}
.stats-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 0;
  flex-wrap: wrap;
  margin-bottom: 64px;
  position: relative;
}
.stat-item { 
  text-align: center; 
  padding: 0 40px;
  position: relative;
}
.stat-item:not(:last-child)::after {
  content: '';
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  height: 48px;
  width: 1px;
  background: linear-gradient(180deg, transparent, var(--dim), transparent);
  opacity: 0.25;
}
.stat-number {
  font-family: var(--sans);
  font-size: 64px;
  font-weight: 800;
  color: var(--accent);
  line-height: 1;
  margin-bottom: 10px;
  letter-spacing: -0.02em;
}
.stat-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.15em;
}
.experts-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
  margin-bottom: 56px;
}
.expert-card {
  background: var(--surface);
  border-radius: 24px;
  padding: 32px 28px;
  text-align: center;
  backdrop-filter: blur(24px);
  border: 1px solid rgba(0,0,0,0.06);
  box-shadow: 0 4px 28px rgba(0,0,0,0.04);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}
.expert-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--signal), transparent);
  opacity: 0;
  transition: opacity 0.3s ease;
}
.expert-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 24px 48px rgba(0,0,0,0.08), 0 0 0 1px rgba(62, 71, 68, 0.1);
  border-color: rgba(62, 71, 68, 0.15);
}
.expert-card:hover::before {
  opacity: 1;
}
.expert-avatar {
  width: 80px; height: 80px;
  border-radius: 50%;
  margin: 0 auto 20px;
  background: linear-gradient(135deg, var(--accent), var(--signal));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: 700;
  color: white;
  position: relative;
  transition: all 0.4s ease;
}
.expert-card:hover .expert-avatar {
  animation: glowRing 2s ease-in-out infinite;
}
.expert-name {
  font-family: var(--sans);
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text);
  letter-spacing: 0.01em;
}
.expert-title {
  font-family: var(--serif);
  font-size: 13px;
  color: var(--dim);
  line-height: 1.6;
}
.round-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px 0;
  border-bottom: 1px solid rgba(0,0,0,0.08);
  margin-bottom: 36px;
}
.round-label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--dim);
}
.round-title {
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.02em;
}
.speech-block {
  background: var(--surface);
  padding: 32px 36px;
  margin-bottom: 24px;
  border-radius: 20px;
  backdrop-filter: blur(20px);
  border: 1px solid rgba(0,0,0,0.04);
  box-shadow: 0 2px 16px rgba(0,0,0,0.03);
  position: relative;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.speech-block::before {
  content: '';
  position: absolute;
  left: 0; top: 24px; bottom: 24px;
  width: 4px;
  background: linear-gradient(180deg, var(--accent), var(--signal));
  border-radius: 2px;
}
.speech-block:hover { 
  transform: translateX(6px);
  border-color: rgba(62, 71, 68, 0.1);
  box-shadow: 0 8px 32px rgba(0,0,0,0.06);
}
.speech-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.speech-speaker {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 16px;
  color: var(--accent);
  letter-spacing: 0.01em;
}
.speech-tag {
  font-family: var(--mono);
  font-size: 10px;
  padding: 6px 12px;
  background: rgba(62,71,68,0.08);
  color: var(--accent);
  border-radius: 6px;
  letter-spacing: 0.08em;
  border: 1px solid rgba(62, 71, 68, 0.1);
}
.speech-content {
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.9;
  color: var(--text);
  letter-spacing: 0.01em;
}
.clash-block {
  background: linear-gradient(135deg, rgba(196,69,54,0.08), rgba(196,69,54,0.02));
  padding: 32px 36px;
  margin-bottom: 24px;
  border-radius: 20px;
  border: 1px solid rgba(196,69,54,0.18);
  position: relative;
  box-shadow: 0 4px 24px rgba(196, 69, 54, 0.06);
}
.clash-block::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 5px;
  background: linear-gradient(180deg, var(--clash-red), rgba(196,69,54,0.3));
  border-radius: 5px 0 0 5px;
  box-shadow: 0 0 20px rgba(196, 69, 54, 0.3);
}
.clash-header {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--clash-red);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.clash-header::before { 
  content: '⚡'; 
  font-size: 14px;
}
.clash-content {
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.9;
  color: var(--text);
  letter-spacing: 0.01em;
}
.insight-block {
  background: linear-gradient(135deg, rgba(45,106,79,0.1), rgba(45,106,79,0.02));
  padding: 36px;
  margin-bottom: 24px;
  border-radius: 20px;
  border: 1px solid rgba(45,106,79,0.22);
  position: relative;
  box-shadow: 0 4px 32px rgba(45, 106, 79, 0.06);
}
.insight-block::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 5px;
  background: linear-gradient(180deg, var(--insight-green), rgba(45,106,79,0.3));
  border-radius: 5px 0 0 5px;
  box-shadow: 0 0 24px rgba(45, 106, 79, 0.3);
}
.insight-header {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--insight-green);
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.insight-header::before { 
  content: '◆'; 
  font-size: 12px;
}
.insight-core {
  font-family: var(--sans);
  font-size: 22px;
  font-weight: 700;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 18px;
  letter-spacing: -0.01em;
}
.insight-detail {
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.9;
  color: rgba(26,25,24,0.8);
  letter-spacing: 0.01em;
}
.question-card {
  background: var(--surface);
  padding: 28px 32px;
  margin-bottom: 18px;
  border-radius: 18px;
  border: 1px solid rgba(0,0,0,0.06);
  box-shadow: 0 2px 16px rgba(0,0,0,0.03);
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
  position: relative;
}
.question-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0;
  transition: opacity 0.3s ease;
}
.question-card:hover {
  border-color: var(--accent);
  box-shadow: 0 12px 36px rgba(62,71,68,0.1), 0 0 0 1px rgba(62, 71, 68, 0.08);
  transform: translateY(-2px);
}
.question-card:hover::before {
  opacity: 1;
}
.question-card .q-text {
  font-family: var(--sans);
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 14px;
  letter-spacing: 0.01em;
}
.question-card .q-text::before {
  content: '?';
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--accent), var(--signal));
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 800;
  color: white;
  flex-shrink: 0;
}
.question-card .q-answer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), padding 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  font-family: var(--serif);
  font-size: 15px;
  line-height: 1.85;
  color: var(--dim);
}
.question-card:hover .q-answer {
  max-height: 280px;
  padding-top: 18px;
}
.conclusion-card {
  background: linear-gradient(135deg, rgba(62,71,68,0.06), rgba(113,109,98,0.06));
  padding: 48px 56px;
  border-radius: 24px;
  text-align: center;
  border: 1px solid rgba(0,0,0,0.06);
  margin-top: 48px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 32px rgba(0,0,0,0.04);
}
.conclusion-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--signal), var(--accent), transparent);
}
.conclusion-title {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 24px;
}
.conclusion-text {
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 600;
  line-height: 1.7;
  color: var(--text);
  letter-spacing: 0.01em;
}
#nav {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 18px;
  z-index: 100;
  background: rgba(245,244,240,0.92);
  padding: 14px 24px;
  border-radius: 48px;
  backdrop-filter: blur(24px);
  border: 1px solid rgba(0,0,0,0.08);
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
}
.nav-btn {
  width: 40px; height: 40px;
  border: 1px solid rgba(0,0,0,0.12);
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--dim);
  border-radius: 50%;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.nav-btn:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
  box-shadow: 0 4px 16px rgba(62, 71, 68, 0.2);
}
.nav-dots { display: flex; gap: 8px; }
.nav-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: rgba(0,0,0,0.15);
  cursor: pointer;
  border: none;
  padding: 0;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.nav-dot.active {
  background: var(--accent);
  box-shadow: 0 0 12px rgba(62, 71, 68, 0.3);
  transform: scale(1.2);
}
#progress {
  position: fixed;
  top: 0; left: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--signal), var(--accent));
  background-size: 200% 100%;
  width: 0;
  z-index: 1000;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  animation: shimmer 3s linear infinite;
}
#counter {
  position: fixed;
  top: 28px;
  right: 32px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--dim);
  z-index: 100;
  letter-spacing: 0.15em;
  background: rgba(245,244,240,0.85);
  padding: 8px 16px;
  border-radius: 20px;
  backdrop-filter: blur(12px);
  border: 1px solid rgba(0,0,0,0.06);
  box-shadow: 0 2px 12px rgba(0,0,0,0.04);
}
@media (max-width: 768px) {
  .section-round { padding: 36px 24px; }
  .experts-grid { grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .stats-row { gap: 0; }
  .stat-item { padding: 0 24px; }
  .stat-number { font-size: 48px; }
  .main-title { font-size: 48px; }
  .frame { padding: 0 12px; }
  .speech-block, .clash-block, .insight-block { padding: 24px 28px; }
  .conclusion-card { padding: 36px 28px; }
}
@media (max-width: 480px) {
  .experts-grid { grid-template-columns: 1fr; }
  .stats-row { flex-direction: column; gap: 24px; }
  .stat-item { padding: 12px 0; }
  .stat-item:not(:last-child)::after { display: none; }
  .stat-number { font-size: 40px; }
  .main-title { font-size: 40px; }
}
</style>
</head>
<body>
<div id="progress"></div>
<div class="sections">
<div class="frame">
  <div class="inner">
    <div class="slides">
{{slides}}
    </div>
  </div>
</div>
</div>
<div id="nav">
  <button class="nav-btn" id="prevBtn">◀</button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn">▶</button>
</div>
<div id="counter">1 / 1</div>


<script>
(function(){
  const slides=document.querySelectorAll('.slide');
  const total=slides.length;
  let cur=0;
  const dotsContainer=document.getElementById('dots');
  const counter=document.getElementById('counter');
  const progress=document.getElementById('progressBar');
  const isHorizontal=document.body.style.flexDirection==='row'||document.documentElement.style.scrollSnapType?.includes('x');

  slides.forEach((s,i)=>{
    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' active':'');
    dot.onclick=()=>go(i);
    dotsContainer.appendChild(dot);
  });

  function go(n){
    if(n<0||n>=total)return;
    slides[cur].classList.remove('visible');
    dotsContainer.children[cur]?.classList.remove('active');
    cur=n;
    slides[cur].scrollIntoView({behavior:'smooth',block:'start',inline:'start'});
    slides[cur].classList.add('visible');
    dotsContainer.children[cur]?.classList.add('active');
    if(counter)counter.textContent=(cur+1)+' / '+total;
    if(progress){const pct=Math.min(100,((cur+1)/total)*100);progress.style.width=pct+'%';}
  }

  document.getElementById('prevBtn')?.addEventListener('click',()=>go(cur-1));
  document.getElementById('nextBtn')?.addEventListener('click',()=>go(cur+1));

  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){
      e.preventDefault();go(cur+1);
    }else if(e.key==='ArrowUp'||e.key==='ArrowLeft'||e.key==='PageUp'){
      e.preventDefault();go(cur-1);
    }else if(e.key==='Home'){
      e.preventDefault();go(0);
    }else if(e.key==='End'){
      e.preventDefault();go(total-1);
    }
  });

  let wheelTimer=null;
  document.addEventListener('wheel',e=>{
    e.preventDefault();
    if(wheelTimer)return;
    wheelTimer=setTimeout(()=>wheelTimer=null,400);
    if(e.deltaY>0)go(cur+1);
    else if(e.deltaY<0)go(cur-1);
  },{passive:false});

  document.body.addEventListener('click',e=>{
    if(e.target.closest('.nav-dot,.dots,.nav-btn,.expert-card,.speech-card,.clash-block,.insight-block,.question-card,.conclusion-item,.stat-item,.card'))return;
    go(cur+1);
  });

  go(0);
})();
</script>
</body>
</html>
