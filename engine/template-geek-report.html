<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<style>
:root {
  --frame: #252525;
  --paper: #e2deda;
  --ink: #292929;
  --soft: rgba(41, 41, 41, 0.58);
  --line: rgba(41, 41, 41, 0.18);
  --red: #eb4e3d;
  --blue: #8ba5ba;
  --acid: #c9f044;
  --green: #7d9c77;
  --terminal: #202020;
  --terminal-text: #e2deda;
  --sans: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  --mono: Consolas, "SFMono-Regular", Menlo, Monaco, monospace;
  --mono-cjk: "Hiragino Sans GB", "STHeiti", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--frame); color: var(--terminal-text); font-family: var(--mono-cjk); -webkit-font-smoothing: antialiased; }
.frame { position: fixed; inset: 0; padding: 9vh 7.5vw; background: radial-gradient(circle at 50% 48%, rgba(226, 222, 218, 0.09), transparent 48%), repeating-linear-gradient(45deg, rgba(226, 222, 218, 0.05) 0 1px, transparent 1px 4px), repeating-linear-gradient(135deg, rgba(0, 0, 0, 0.12) 0 1px, transparent 1px 5px), #262625; overflow: hidden; }
.inner { position: relative; width: 100%; height: 100%; overflow: hidden; border: 1px solid rgba(226, 222, 218, 0.12); border-radius: 8px; background: linear-gradient(90deg, rgba(226, 222, 218, 0.035) 1px, transparent 1px), linear-gradient(180deg, rgba(226, 222, 218, 0.025) 1px, transparent 1px), radial-gradient(circle at 50% 50%, transparent 52%, rgba(0, 0, 0, 0.24) 100%), var(--terminal); background-size: calc(100% / 17) 100%, 100% calc(100% / 9), auto; box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42), 0 0 0 1px rgba(0, 0, 0, 0.36), inset 0 1px 0 rgba(226, 222, 218, 0.1), inset 0 0 76px rgba(0, 0, 0, 0.3); }
.slides { position: absolute; inset: 0; }
.slide { position: absolute; inset: 0; display: none; flex-direction: column; padding: 16px; }
.slide.active { display: flex; }
.meta-line { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 8px; color: rgba(226, 222, 218, 0.35); text-transform: uppercase; letter-spacing: 0.1em; }
.meta-line.top { padding-bottom: 12px; border-bottom: 1px solid rgba(226, 222, 218, 0.08); }
.meta-line.bottom { margin-top: auto; padding-top: 12px; border-top: 1px solid rgba(226, 222, 218, 0.08); }
.hero-zone { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.hero-label { font-family: var(--mono); font-size: 10px; color: var(--acid); letter-spacing: 0.2em; margin-bottom: 16px; }
.hero-title { font-family: var(--mono-cjk); font-size: clamp(24px, 4vw, 48px); font-weight: 700; color: var(--terminal-text); line-height: 1.3; }
.hero-sub { font-family: var(--mono-cjk); font-size: clamp(14px, 2vw, 24px); color: rgba(226, 222, 218, 0.5); margin-top: 8px; }
.question-block { flex: 1; display: flex; align-items: center; justify-content: center; }
.question-text { font-family: var(--mono-cjk); font-size: clamp(20px, 3.5vw, 42px); font-weight: 700; color: var(--terminal-text); line-height: 1.4; text-align: center; max-width: 90%; }
.statements-grid { flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; overflow: auto; }
.statement-block { background: rgba(226, 222, 218, 0.04); border: 1px solid rgba(226, 222, 218, 0.08); border-radius: 4px; padding: 12px; }
.statement-meta { display: flex; justify-content: space-between; margin-bottom: 8px; }
.statement-speaker { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--acid); }
.statement-role { font-family: var(--mono); font-size: 8px; color: rgba(226, 222, 218, 0.4); }
.statement-text { font-family: var(--mono-cjk); font-size: 12px; line-height: 1.6; color: rgba(226, 222, 218, 0.75); }
#nav { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; z-index: 100; background: rgba(0,0,0,0.8); padding: 8px 16px; border-radius: 20px; }
.nav-btn { width: 32px; height: 32px; border: 1px solid rgba(226, 222, 218, 0.2); background: transparent; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--terminal-text); }
.nav-btn:hover { background: rgba(226, 222, 218, 0.1); }
.dots { display: flex; gap: 4px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(226, 222, 218, 0.3); cursor: pointer; }
.dot.active { background: var(--acid); }
#counter { position: fixed; top: 16px; right: 20px; font-family: var(--mono); font-size: 9px; color: rgba(226, 222, 218, 0.4); z-index: 100; }
</style>
</head>
<body>
{{slides}}
<div id="nav">
  <button class="nav-btn" id="prevBtn">◀</button>
  <div class="dots" id="dots"></div>
  <button class="nav-btn" id="nextBtn">▶</button>
</div>
<div id="counter">1 / 1</div>
<script>
(function(){
  const slides = document.querySelectorAll('.slide');
  const total = slides.length;
  let cur = 0;
  const dotsContainer = document.getElementById('dots');
  const counter = document.getElementById('counter');
  
  slides.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.onclick = () => go(i);
    dotsContainer.appendChild(dot);
  });
  
  function go(n) {
    if (n < 0 || n >= total) return;
    slides[cur].classList.remove('active');
    dotsContainer.children[cur].classList.remove('active');
    cur = n;
    slides[cur].classList.add('active');
    dotsContainer.children[cur].classList.add('active');
    counter.textContent = (cur + 1) + ' / ' + total;
  }
  
  document.getElementById('prevBtn').onclick = () => go(cur - 1);
  document.getElementById('nextBtn').onclick = () => go(cur + 1);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') go(cur + 1);
    else if (e.key === 'ArrowLeft') go(cur - 1);
  });
  
  go(0);
})();
</script>
</body>
</html>
