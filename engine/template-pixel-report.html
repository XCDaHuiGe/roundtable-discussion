<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<style>
:root {
  --bg: #0d0d0d;
  --surface: #1a1a1a;
  --grid: rgba(255,255,255,0.03);
  --text: #e0e0e0;
  --dim: #666666;
  --accent: #ff6b6b;
  --cyan: #4ecdc4;
  --glow: rgba(255,107,107,0.3);
  --mono: 'Courier New', monospace;
  --sans: system-ui, -apple-system, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; }
body { display: flex; width: max-content; height: 100vh; background: var(--bg); font-family: var(--sans); color: var(--text); }
.slide { width: 100vw; height: 100vh; min-width: 100vw; scroll-snap-align: start; display: flex; flex-direction: column; position: relative; background-image: repeating-linear-gradient(0deg, transparent, transparent 49px, var(--grid) 50px), repeating-linear-gradient(90deg, transparent, transparent 49px, var(--grid) 50px); }
.slide-cover { justify-content: center; align-items: center; text-align: center; }
.slide-dark { padding: 48px 64px; }
.frame { max-width: 800px; margin: 0 auto; width: 100%; }
.hud-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: var(--surface); border: 1px solid var(--grid); margin-bottom: 32px; }
.hud-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--dim); }
.hud-accent { color: var(--accent); }
.hud-title { font-family: var(--mono); font-size: 14px; font-weight: 700; }
.step-block { background: var(--surface); border: 1px solid var(--grid); padding: 24px; margin-bottom: 16px; position: relative; overflow: hidden; }
.step-block::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent); }
.step-block::after { content: ''; position: absolute; top: 0; right: 0; width: 100px; height: 100px; background: radial-gradient(circle, var(--glow), transparent 70%); pointer-events: none; }
.step-num { font-family: var(--mono); font-size: 11px; color: var(--accent); margin-bottom: 8px; }
.step-content { font-size: 14px; line-height: 1.8; }
.speaker-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--grid); padding: 8px 16px; margin-right: 12px; margin-bottom: 12px; }
.chip-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--cyan); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--bg); }
.chip-name { font-size: 13px; font-weight: 600; }
.insight-block { background: linear-gradient(135deg, rgba(78,205,196,0.15), rgba(78,205,196,0.05)); border: 1px solid var(--cyan); padding: 24px; margin-top: 16px; }
.insight-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--cyan); margin-bottom: 12px; }
.insight-text { font-size: 15px; line-height: 1.7; }
#nav { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; z-index: 100; background: var(--surface); border: 1px solid var(--grid); padding: 8px 16px; }
.nav-btn { width: 32px; height: 32px; border: 1px solid var(--grid); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--dim); }
.nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.dots { display: flex; gap: 4px; }
.dot { width: 6px; height: 6px; border-radius: 0; background: var(--dim); cursor: pointer; }
.dot.active { background: var(--accent); }
#counter { position: fixed; top: 20px; right: 24px; font-family: var(--mono); font-size: 10px; color: var(--dim); z-index: 100; }
</style>
</head>
<body>
{{slides}}
<div id="nav">
  <button class="nav-btn" id="prevBtn">◀</button>
  <div class="dots" id="dots"></div>
  <button class="nav-btn" id="nextBtn">▶</button>
</div>
<div id="counter">1 / 1</div>
<script>
(function(){
  const slides = document.querySelectorAll('.slide');
  const total = slides.length;
  let cur = 0;
  const dots = document.getElementById('dots');
  const counter = document.getElementById('counter');
  
  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.onclick = () => go(i);
    dots.appendChild(d);
  });
  
  function go(n) {
    if (n < 0 || n >= total) return;
    slides[cur].style.display = 'none';
    dots.children[cur].classList.remove('active');
    cur = n;
    slides[cur].style.display = 'flex';
    dots.children[cur].classList.add('active');
    counter.textContent = (cur + 1) + ' / ' + total;
  }
  
  document.getElementById('prevBtn').onclick = () => go(cur - 1);
  document.getElementById('nextBtn').onclick = () => go(cur + 1);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') go(cur + 1);
    else if (e.key === 'ArrowLeft') go(cur - 1);
  });
  
  go(0);
})();
</script>
</body>
</html>
