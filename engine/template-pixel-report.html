<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Noto+Serif+SC:wght@400;600;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --surface: rgba(26,26,26,0.95);
  --grid: rgba(255,255,255,0.05);
  --grid-strong: rgba(255,255,255,0.08);
  --text: #f0f0f0;
  --dim: #888888;
  --accent: #ff6b6b;
  --accent-glow: rgba(255,107,107,0.5);
  --cyan: #4ecdc4;
  --cyan-glow: rgba(78,205,196,0.5);
  --clash-red: #ff4757;
  --insight-green: #00d4aa;
  --mono: 'JetBrains Mono', 'Courier New', monospace;
  --sans: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
  --serif: 'Noto Serif SC', Georgia, serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { 
  background: var(--bg); 
  font-family: var(--sans); 
  color: var(--text);
  overflow-x: hidden;
  overflow:hidden;
  scroll-snap-type: y mandatory;
  position: relative;
}
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-image: 
    repeating-linear-gradient(0deg, transparent, transparent 39px, var(--grid) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, var(--grid) 40px);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: 
    radial-gradient(ellipse at 30% 20%, rgba(255,107,107,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(78,205,196,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(255,107,107,0.03) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
.slide { 
  height: 100vh; 
  overflow:hidden;
  scroll-snap-align: start;
  display: flex; 
  flex-direction: column; 
  position: relative;
  z-index: 1;
  opacity: 0;
  transform: translateY(50px);
  animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.slide:nth-child(1) { animation-delay: 0.05s; }
.slide:nth-child(2) { animation-delay: 0.1s; }
.slide:nth-child(3) { animation-delay: 0.15s; }
.slide:nth-child(4) { animation-delay: 0.2s; }
.slide:nth-child(5) { animation-delay: 0.25s; }
.slide:nth-child(n+6) { animation-delay: 0.3s; }
@keyframes fadeInUp {
  to { opacity: 1; transform: translateY(0); }
}
.slide-cover { 
  justify-content: center; 
  align-items: center; 
  text-align: center; 
  padding: 60px 24px;
  background: radial-gradient(ellipse at center, rgba(255,107,107,0.12) 0%, transparent 60%);
  position: relative;
}
.slide-cover::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-image: 
    repeating-linear-gradient(0deg, transparent, transparent 39px, var(--grid-strong) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, var(--grid-strong) 40px);
  pointer-events: none;
  opacity: 0.5;
}
.slide-content { 
  padding: 80px 24px; 
  max-width: 1200px; 
  margin: 0 auto; 
  width: 100%;
  position: relative;
}
.cover-badge { 
  display: inline-block; 
  padding: 10px 24px; 
  border: 2px solid var(--accent); 
  font-family: var(--mono);
  font-size: 11px; 
  letter-spacing: 0.25em; 
  text-transform: uppercase; 
  color: var(--accent); 
  margin-bottom: 48px; 
  font-weight: 600;
  background: rgba(255,107,107,0.15);
  position: relative;
  box-shadow: 0 0 20px var(--accent-glow), inset 0 0 20px rgba(255,107,107,0.1);
}
.cover-title { 
  font-family: var(--mono); 
  font-size: clamp(48px, 9vw, 88px); 
  font-weight: 800; 
  line-height: 1.1; 
  margin-bottom: 36px; 
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, var(--text) 0%, var(--accent) 50%, var(--cyan) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  position: relative;
  text-shadow: none;
}
.cover-title::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 60%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--cyan), transparent);
  box-shadow: 0 0 20px var(--accent-glow);
}
.cover-sub { 
  font-size: 18px; 
  color: var(--dim); 
  line-height: 1.9; 
  max-width: 640px; 
  margin: 0 auto 56px; 
  font-weight: 400;
  letter-spacing: 0.02em;
}
.cover-stats { 
  display: flex; 
  justify-content: center; 
  gap: 0;
  flex-wrap: wrap;
  position: relative;
}
.cover-stat { 
  text-align: center; 
  padding: 28px 40px;
  background: var(--surface);
  border: 1px solid var(--grid);
  backdrop-filter: blur(16px);
  min-width: 130px;
  position: relative;
}
.cover-stat:first-child {
  border-radius: 0;
}
.cover-stat:last-child {
  border-radius: 0;
}
.cover-stat::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--cyan));
  box-shadow: 0 0 15px var(--accent-glow);
}
.cover-stat:not(:last-child)::after {
  content: '';
  position: absolute;
  right: 0;
  top: 20%;
  height: 60%;
  width: 2px;
  background: linear-gradient(180deg, transparent, var(--accent), var(--cyan), transparent);
  box-shadow: 0 0 10px var(--accent-glow);
}
.cover-stat-num { 
  font-family: var(--mono); 
  font-size: 52px; 
  font-weight: 800; 
  color: var(--accent); 
  line-height: 1;
  text-shadow: 0 0 30px var(--accent-glow);
  letter-spacing: -0.02em;
}
.cover-stat-label { 
  font-family: var(--mono);
  font-size: 10px; 
  color: var(--dim); 
  letter-spacing: 0.2em; 
  text-transform: uppercase; 
  margin-top: 10px;
  font-weight: 600;
}
.section-header { 
  margin-bottom: 56px; 
  text-align: center;
  position: relative;
}
.section-tag { 
  font-family: var(--mono);
  font-size: 11px; 
  letter-spacing: 0.25em; 
  text-transform: uppercase; 
  color: var(--accent); 
  margin-bottom: 16px; 
  display: block;
  font-weight: 600;
}
.section-title { 
  font-family: var(--mono); 
  font-size: clamp(32px, 5.5vw, 48px); 
  font-weight: 800; 
  line-height: 1.25;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
}
.experts-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
  margin-bottom: 56px;
}
@media (max-width: 900px) {
  .experts-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .experts-grid { grid-template-columns: 1fr; }
}
.expert-card {
  background: var(--surface);
  border: 1px solid var(--grid);
  padding: 36px;
  backdrop-filter: blur(16px);
  position: relative;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  overflow: hidden;
}
.expert-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 5px;
  height: 100%;
  background: linear-gradient(180deg, var(--accent), var(--cyan));
  box-shadow: 0 0 15px var(--accent-glow);
}
.expert-card::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--cyan));
  opacity: 0;
  transition: opacity 0.4s ease;
}
.expert-card:hover {
  transform: translateY(-8px);
  border-color: var(--accent);
  box-shadow: 0 0 40px var(--accent-glow), 0 20px 60px rgba(255,107,107,0.2);
}
.expert-card:hover::after {
  opacity: 1;
}
.expert-avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--cyan));
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--bg);
  font-weight: 800;
  font-size: 26px;
  margin-bottom: 24px;
  box-shadow: 0 0 30px var(--accent-glow);
  transition: all 0.4s ease;
  position: relative;
}
.expert-card:hover .expert-avatar {
  box-shadow: 0 0 50px var(--accent-glow), 0 0 0 4px rgba(255,107,107,0.3);
  transform: scale(1.05);
}
.expert-name { 
  font-weight: 700; 
  font-size: 19px; 
  margin-bottom: 6px;
  letter-spacing: 0.01em;
}
.expert-role { 
  font-family: var(--mono);
  font-size: 12px; 
  color: var(--dim);
  margin-bottom: 16px;
  letter-spacing: 0.03em;
}
.expert-desc {
  font-size: 14px;
  line-height: 1.85;
  color: #aaa;
  letter-spacing: 0.01em;
}
.round-card {
  background: var(--surface);
  border: 1px solid var(--grid);
  padding: 44px;
  margin-bottom: 36px;
  backdrop-filter: blur(16px);
  position: relative;
  overflow: hidden;
}
.round-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--accent), var(--cyan), var(--accent));
  background-size: 200% 100%;
  animation: gradientShift 6s ease infinite;
  box-shadow: 0 0 20px var(--accent-glow);
}
@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
.round-header {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--grid);
}
.round-badge {
  padding: 8px 20px;
  background: linear-gradient(135deg, var(--accent), var(--cyan));
  color: var(--bg);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.15em;
  box-shadow: 0 0 20px var(--accent-glow);
}
.round-title {
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.speech-block {
  padding: 28px 32px;
  margin-bottom: 24px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--grid);
  position: relative;
  transition: all 0.3s ease;
  overflow: hidden;
}
.speech-block::after {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 100px;
  height: 100px;
  background: radial-gradient(circle, var(--accent-glow), transparent 70%);
  pointer-events: none;
  opacity: 0.2;
}
.speech-block:hover {
  border-color: rgba(255,107,107,0.3);
  box-shadow: 0 0 30px rgba(255,107,107,0.1);
}
.speech-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
}
.speech-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--cyan));
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--bg);
  font-weight: 700;
  font-size: 15px;
  box-shadow: 0 0 20px var(--accent-glow);
}
.speech-name {
  font-weight: 600;
  font-size: 16px;
  letter-spacing: 0.01em;
}
.speech-role {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  letter-spacing: 0.05em;
}
.speech-content {
  font-size: 15px;
  line-height: 1.9;
  color: var(--text);
  letter-spacing: 0.01em;
}
.clash-block {
  padding: 32px 32px 32px 44px;
  margin-bottom: 24px;
  background: linear-gradient(135deg, rgba(255,71,87,0.12), rgba(255,71,87,0.04));
  border: 1px solid rgba(255,71,87,0.4);
  position: relative;
  overflow: hidden;
}
.clash-block::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 5px;
  height: 100%;
  background: linear-gradient(180deg, var(--clash-red), #ff6b7a);
  box-shadow: 0 0 30px rgba(255,71,87,0.6), 0 0 60px rgba(255,71,87,0.3);
}
.clash-block::after {
  content: 'COLLISION';
  position: absolute;
  top: -1px;
  left: 24px;
  background: linear-gradient(135deg, var(--clash-red), #ff6b7a);
  color: white;
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 800;
  padding: 6px 14px;
  letter-spacing: 0.2em;
  box-shadow: 0 0 20px rgba(255,71,87,0.5);
}
.clash-content {
  font-size: 15px;
  line-height: 1.9;
  color: var(--text);
  letter-spacing: 0.01em;
}
.insight-block {
  padding: 36px 36px 36px 48px;
  margin-top: 28px;
  background: linear-gradient(135deg, rgba(0,212,170,0.15), rgba(78,205,196,0.08));
  border: 1px solid rgba(0,212,170,0.5);
  position: relative;
  overflow: hidden;
}
.insight-block::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 5px;
  height: 100%;
  background: linear-gradient(180deg, var(--insight-green), var(--cyan));
  box-shadow: 0 0 30px rgba(0,212,170,0.6), 0 0 60px rgba(78,205,196,0.3);
}
.insight-block::after {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 150px;
  height: 150px;
  background: radial-gradient(circle, rgba(0,212,170,0.15) 0%, transparent 70%);
  pointer-events: none;
}
.insight-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--insight-green);
  margin-bottom: 14px;
  font-weight: 800;
}
.insight-text {
  font-family: var(--serif);
  font-size: 19px;
  line-height: 1.85;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.01em;
}
.question-card {
  background: var(--surface);
  border: 1px solid var(--grid);
  margin-bottom: 18px;
  overflow: hidden;
  backdrop-filter: blur(16px);
  position: relative;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.question-card::before {
  content: '>';
  position: absolute;
  left: 28px;
  top: 50%;
  transform: translateY(-50%);
  font-family: var(--mono);
  color: var(--cyan);
  font-size: 16px;
  opacity: 0;
  transition: opacity 0.4s ease;
  text-shadow: 0 0 10px var(--cyan-glow);
}
.question-card:hover {
  border-color: var(--cyan);
  box-shadow: 0 0 30px var(--cyan-glow);
}
.question-card:hover::before {
  opacity: 1;
}
.question-header {
  padding: 28px 32px 28px 48px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: background 0.3s ease;
}
.question-header:hover {
  background: rgba(78,205,196,0.08);
}
.question-title {
  font-weight: 600;
  font-size: 16px;
  color: var(--text);
  letter-spacing: 0.01em;
}
.question-icon {
  width: 28px;
  height: 28px;
  border-radius: 0;
  background: var(--cyan);
  color: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 800;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 0 15px var(--cyan-glow);
}
.question-card:hover .question-icon {
  background: var(--accent);
  transform: rotate(90deg);
  box-shadow: 0 0 25px var(--accent-glow);
}
.question-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s cubic-bezier(0.16, 1, 0.3, 1), padding 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}
.question-card:hover .question-content {
  max-height: 600px;
  padding: 0 32px 28px 48px;
}
.question-text {
  font-size: 15px;
  line-height: 1.9;
  color: #aaa;
  letter-spacing: 0.01em;
}
.conclusion-card {
  background: linear-gradient(135deg, var(--accent), var(--cyan));
  padding: 56px 48px;
  text-align: center;
  color: var(--bg);
  margin: 56px auto 0;
  max-width: 800px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 60px var(--accent-glow), 0 20px 60px rgba(255,107,107,0.3);
}
.conclusion-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, rgba(255,255,255,0.3), rgba(255,255,255,0.6), rgba(255,255,255,0.3));
  box-shadow: 0 0 20px rgba(255,255,255,0.3);
}
.conclusion-card::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: 
    repeating-linear-gradient(0deg, transparent, transparent 19px, rgba(0,0,0,0.15) 20px),
    repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(0,0,0,0.15) 20px);
  pointer-events: none;
}
.conclusion-title {
  font-family: var(--mono);
  font-size: 32px;
  font-weight: 800;
  margin-bottom: 20px;
  letter-spacing: -0.01em;
  position: relative;
  text-shadow: 0 2px 10px rgba(0,0,0,0.2);
}
.conclusion-text {
  font-size: 17px;
  line-height: 1.9;
  opacity: 0.95;
  max-width: 600px;
  margin: 0 auto;
  letter-spacing: 0.02em;
  position: relative;
}
#nav { 
  position: fixed; 
  bottom: 32px; 
  left: 50%; 
  transform: translateX(-50%); 
  display: flex; 
  align-items: center; 
  gap: 18px; 
  z-index: 100; 
  background: var(--surface); 
  border: 1px solid var(--grid);
  padding: 14px 28px;
  backdrop-filter: blur(16px);
  box-shadow: 0 0 30px rgba(255,107,107,0.1);
}
.nav-btn { 
  width: 44px; 
  height: 44px; 
  border: 1px solid var(--grid); 
  background: transparent; 
  cursor: pointer; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  font-family: var(--mono);
  font-size: 14px; 
  color: var(--dim);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.nav-btn:hover { 
  border-color: var(--accent); 
  color: var(--accent);
  box-shadow: 0 0 25px var(--accent-glow);
  transform: scale(1.1);
}
.dots { 
  display: flex; 
  gap: 10px; 
}
.dot { 
  width: 10px; 
  height: 10px; 
  border-radius: 0; 
  background: var(--dim); 
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.dot:hover {
  background: var(--accent);
  box-shadow: 0 0 15px var(--accent-glow);
  transform: scale(1.2);
}
.dot.active { 
  background: linear-gradient(135deg, var(--accent), var(--cyan)); 
  width: 28px;
  box-shadow: 0 0 20px var(--accent-glow);
}
#counter { 
  position: fixed; 
  top: 28px; 
  right: 36px; 
  font-family: var(--mono);
  font-size: 12px; 
  color: var(--dim); 
  z-index: 100;
  font-weight: 600;
  background: var(--surface);
  padding: 10px 20px;
  border: 1px solid var(--grid);
  backdrop-filter: blur(16px);
  letter-spacing: 0.1em;
  box-shadow: 0 0 20px rgba(255,107,107,0.1);
}
#progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--accent), var(--cyan));
  z-index: 1000;
  transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 0 20px var(--accent-glow);
}
@media (max-width: 768px) {
  .slide-content { padding: 60px 20px; }
  .cover-stats { flex-direction: column; gap: 16px; }
  .cover-stat { min-width: 100%; padding: 24px; }
  .cover-stat:not(:last-child)::after { display: none; }
  .cover-stat-num { font-size: 40px; }
  .experts-grid { grid-template-columns: 1fr; }
  .round-card { padding: 32px 24px; }
  .insight-block { padding: 28px 24px 28px 36px; }
  .conclusion-card { padding: 40px 28px; margin: 40px 16px 0; }
  #nav { bottom: 20px; padding: 12px 20px; }
}
</style>
</head>
<body>
<div id="progress" style="width: 0%;"></div>
<div class="frame">
  <div class="inner">
    <div class="slides">
{{slides}}
    </div>
  </div>
</div>
<div id="nav">
  <button class="nav-btn" id="prevBtn">◀</button>
  <div class="dots" id="dots"></div>
  <button class="nav-btn" id="nextBtn">▶</button>
</div>
<div id="counter">1 / 1</div>
<script>
(function(){
  const slides = document.querySelectorAll('.slide');
  const total = slides.length;
  let cur = 0;
  const dots = document.getElementById('dots');
  const counter = document.getElementById('counter');
  const progress = document.getElementById('progress');
  
  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.onclick = () => go(i);
    dots.appendChild(d);
  });
  
  function go(n) {
    if (n < 0 || n >= total) return;
    slides[cur].classList.remove('visible');
    dots.children[cur].classList.remove('active');
    cur = n;
    slides[cur].scrollIntoView({ behavior: 'smooth', block: 'start' });
    slides[cur].classList.add('visible');
    dots.children[cur].classList.add('active');
    counter.textContent = (cur + 1) + ' / ' + total;
    const pct = Math.min(100, ((cur + 1) / total) * 100);
    progress.style.width = pct + '%';
  }
  
  document.getElementById('prevBtn').onclick = () => go(cur - 1);
  document.getElementById('nextBtn').onclick = () => go(cur + 1);
  
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
      e.preventDefault();
      go(cur + 1);
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault();
      go(cur - 1);
    } else if (e.key === 'Home') {
      e.preventDefault();
      go(0);
    } else if (e.key === 'End') {
      e.preventDefault();
      go(total - 1);
    }
  });
  
  let wheelTimer = null;
  document.addEventListener('wheel', e => {
    e.preventDefault();
    if (wheelTimer) return;
    wheelTimer = setTimeout(() => wheelTimer = null, 400);
    if (e.deltaY > 0) go(cur + 1);
    else if (e.deltaY < 0) go(cur - 1);
  }, { passive: false });
  
  document.body.addEventListener('click', e => {
    if (e.target.closest('.nav-btn, .dot, .expert-card, .speech-block, .clash-block, .insight-block, .question-card, .conclusion-card, #nav')) return;
    go(cur + 1);
  });
  
  go(0);
})();
</script>
