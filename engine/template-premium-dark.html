<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;font-size:16px}
body{
  background:#0a0a0a;
  color:#f5f5f5;
  font-family:'Outfit',system-ui,-apple-system,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
  opacity:0;
  animation:fadeIn 0.8s ease forwards;
  position:relative
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  opacity:0.03;
  pointer-events:none;
  z-index:0
}
@keyframes fadeIn{to{opacity:1}}
::selection{background:#ff6b35;color:#0a0a0a}

:root{
  --bg:#0a0a0a;
  --bg-elevated:#141414;
  --bg-card:rgba(255,255,255,0.04);
  --bg-card-hover:rgba(255,255,255,0.08);
  --text:#f5f5f5;
  --text-muted:#a0a0a0;
  --text-faint:#606060;
  --accent:#ff6b35;
  --accent-glow:rgba(255,107,53,0.2);
  --insight:#00d4aa;
  --insight-glow:rgba(0,212,170,0.15);
  --clash:#ff4757;
  --clash-glow:rgba(255,71,87,0.1);
  --border:rgba(255,255,255,0.08);
  --border-hover:rgba(255,255,255,0.15);
  --radius:20px;
  --radius-sm:12px;
  --serif:'Noto Serif SC',Georgia,serif;
  --mono:'JetBrains Mono',monospace;
  --sans:'Outfit',sans-serif
}

.container{max-width:1000px;margin:0 auto;padding:0 32px;position:relative;z-index:1}

.section{
  min-height:100vh;
  padding:100px 0;
  opacity:0;
  transform:translateY(50px);
  transition:opacity 1s cubic-bezier(0.16,1,0.3,1),transform 1s cubic-bezier(0.16,1,0.3,1);
  position:relative;
  z-index:1
}
.section.visible{opacity:1;transform:translateY(0)}

.hero{text-align:center;padding:140px 0 100px;position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
.hero::before{
  content:'';
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:800px;
  height:800px;
  background:radial-gradient(circle,var(--accent-glow) 0%,transparent 60%);
  opacity:0.5;
  pointer-events:none;
  filter:blur(60px)
}
.hero::after{
  content:'';
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:400px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--border),transparent)
}

.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:10px 24px;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:100px;
  font-family:var(--mono);
  font-size:11px;
  font-weight:600;
  color:var(--accent);
  letter-spacing:0.15em;
  text-transform:uppercase;
  margin-bottom:48px;
  backdrop-filter:blur(10px);
  animation:fadeInUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.1s both
}
.hero-badge::before{
  content:'';
  width:8px;
  height:8px;
  background:var(--accent);
  border-radius:50%;
  animation:pulse 2s infinite;
  box-shadow:0 0 12px var(--accent)
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.8)}}

.hero-title{
  font-family:var(--serif);
  font-size:clamp(3.5rem,10vw,6.5rem);
  font-weight:800;
  line-height:1.05;
  margin-bottom:32px;
  letter-spacing:-0.03em;
  background:linear-gradient(180deg,#ffffff 0%,#b0b0b0 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  animation:fadeInUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.2s both
}
.hero-sub{
  font-size:clamp(1.1rem,2.5vw,1.4rem);
  color:var(--text-muted);
  max-width:650px;
  margin:0 auto 56px;
  line-height:1.85;
  font-weight:400;
  letter-spacing:0.01em;
  animation:fadeInUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.3s both
}

.hero-stats{
  display:flex;
  justify-content:center;
  gap:24px;
  flex-wrap:wrap;
  animation:fadeInUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.4s both
}
.stat{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  padding:24px 36px;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  backdrop-filter:blur(10px);
  transition:all 0.4s cubic-bezier(0.16,1,0.3,1);
  position:relative;
  min-width:120px
}
.stat::after{
  content:'';
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:40px;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:0;
  transition:opacity 0.3s
}
.stat:hover{
  background:var(--bg-card-hover);
  border-color:var(--border-hover);
  transform:translateY(-6px);
  box-shadow:0 20px 40px rgba(0,0,0,0.3)
}
.stat:hover::after{opacity:1}
.stat-num{
  font-family:var(--serif);
  font-size:clamp(2.8rem,6vw,4.5rem);
  font-weight:800;
  color:var(--accent);
  line-height:1;
  letter-spacing:-0.02em
}
.stat-label{
  font-family:var(--mono);
  font-size:10px;
  color:var(--text-faint);
  letter-spacing:0.15em;
  text-transform:uppercase;
  font-weight:500
}

.experts-section{padding:80px 0}
.section-title{
  font-family:var(--serif);
  font-size:clamp(1.8rem,4vw,2.5rem);
  font-weight:800;
  text-align:center;
  margin-bottom:48px;
  letter-spacing:-0.02em
}
.experts-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px
}
.expert-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:36px 28px;
  text-align:center;
  transition:all 0.5s cubic-bezier(0.16,1,0.3,1);
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(10px)
}
.expert-card::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:3px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:0;
  transition:opacity 0.4s
}
.expert-card::after{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 50% 0%,var(--accent-glow) 0%,transparent 60%);
  opacity:0;
  transition:opacity 0.4s
}
.expert-card:hover{
  background:var(--bg-card-hover);
  transform:translateY(-12px);
  border-color:rgba(255,107,53,0.3);
  box-shadow:0 24px 60px rgba(0,0,0,0.4),0 0 40px rgba(255,107,53,0.1)
}
.expert-card:hover::before{opacity:1}
.expert-card:hover::after{opacity:1}
.expert-avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--serif);
  font-size:32px;
  font-weight:800;
  margin:0 auto 24px;
  color:#0a0a0a;
  background:linear-gradient(135deg,var(--accent) 0%,#ff8c5a 100%);
  box-shadow:0 8px 24px rgba(255,107,53,0.3);
  transition:all 0.4s cubic-bezier(0.16,1,0.3,1);
  position:relative;
  z-index:1
}
.expert-card:hover .expert-avatar{
  transform:scale(1.1);
  box-shadow:0 12px 32px rgba(255,107,53,0.5),0 0 0 4px rgba(255,107,53,0.2)
}
.expert-avatar.alt{background:linear-gradient(135deg,#00d4aa 0%,#00f5c4 100%);box-shadow:0 8px 24px rgba(0,212,170,0.3)}
.expert-avatar.alt2{background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);box-shadow:0 8px 24px rgba(99,102,241,0.3)}
.expert-avatar.alt3{background:linear-gradient(135deg,#f59e0b 0%,#fbbf24 100%);box-shadow:0 8px 24px rgba(245,158,11,0.3)}
.expert-avatar.alt4{background:linear-gradient(135deg,#ec4899 0%,#f472b6 100%);box-shadow:0 8px 24px rgba(236,72,153,0.3)}
.expert-avatar.alt5{background:linear-gradient(135deg,#14b8a6 0%,#2dd4bf 100%);box-shadow:0 8px 24px rgba(20,184,166,0.3)}
.expert-name{font-weight:700;font-size:17px;margin-bottom:8px;color:var(--text);letter-spacing:0.01em}
.expert-role{font-family:var(--mono);font-size:11px;color:var(--text-faint);letter-spacing:0.08em}

.round-section{margin-bottom:80px;position:relative}
.round-section::before{
  content:'';
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:1px;
  background:linear-gradient(180deg,transparent,var(--border),transparent)
}
.round-header{
  display:flex;
  align-items:center;
  gap:20px;
  margin-bottom:40px;
  padding-bottom:24px;
  border-bottom:1px solid var(--border);
  position:relative
}
.round-header::after{
  content:'';
  position:absolute;
  bottom:-1px;
  left:0;
  width:120px;
  height:2px;
  background:linear-gradient(90deg,var(--accent),transparent)
}
.round-tag{
  padding:10px 20px;
  background:linear-gradient(135deg,var(--accent) 0%,#ff8c5a 100%);
  color:#0a0a0a;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:0.12em;
  text-transform:uppercase;
  border-radius:6px;
  box-shadow:0 4px 16px rgba(255,107,53,0.3)
}
.round-num{font-family:var(--mono);font-size:12px;color:var(--text-faint);font-weight:500}
.round-title{
  font-family:var(--serif);
  font-size:clamp(1.6rem,4vw,2.2rem);
  font-weight:800;
  line-height:1.3;
  letter-spacing:-0.02em
}

.speech-block{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:32px 36px;
  margin-bottom:24px;
  position:relative;
  transition:all 0.4s cubic-bezier(0.16,1,0.3,1);
  backdrop-filter:blur(10px)
}
.speech-block::before{
  content:'';
  position:absolute;
  left:0;
  top:20px;
  bottom:20px;
  width:4px;
  background:linear-gradient(180deg,var(--accent),#ff8c5a);
  border-radius:4px;
  transition:all 0.3s
}
.speech-block::after{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:1px;
  background:linear-gradient(90deg,var(--accent),transparent 50%);
  opacity:0;
  transition:opacity 0.3s
}
.speech-block:hover{
  background:var(--bg-card-hover);
  border-color:var(--border-hover);
  transform:translateX(6px);
  box-shadow:0 8px 32px rgba(0,0,0,0.2)
}
.speech-block:hover::before{top:12px;bottom:12px;width:5px}
.speech-block:hover::after{opacity:1}
.speech-header{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.speech-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--serif);
  font-size:20px;
  font-weight:800;
  background:linear-gradient(135deg,var(--accent) 0%,#ff8c5a 100%);
  color:#0a0a0a;
  flex-shrink:0;
  transition:transform 0.3s
}
.speech-block:hover .speech-avatar{transform:scale(1.08)}
.speech-name{font-weight:700;font-size:16px;color:var(--text);letter-spacing:0.01em}
.speech-role{font-family:var(--mono);font-size:10px;color:var(--text-faint);letter-spacing:0.08em;margin-top:4px}
.speech-content{font-size:15px;line-height:1.9;color:var(--text-muted);letter-spacing:0.01em}

.clash-block{
  background:var(--clash-glow);
  border:1px solid rgba(255,71,87,0.2);
  border-radius:var(--radius);
  padding:32px 36px;
  margin-bottom:24px;
  position:relative;
  transition:all 0.4s cubic-bezier(0.16,1,0.3,1)
}
.clash-block::before{
  content:'';
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:5px;
  background:var(--clash);
  border-radius:5px 0 0 5px;
  box-shadow:0 0 24px rgba(255,71,87,0.5),-4px 0 20px rgba(255,71,87,0.3)
}
.clash-block:hover{
  background:rgba(255,71,87,0.12);
  border-color:rgba(255,71,87,0.35);
  box-shadow:0 8px 32px rgba(255,71,87,0.15)
}
.clash-label{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  color:var(--clash);
  letter-spacing:0.15em;
  text-transform:uppercase;
  margin-bottom:24px
}
.clash-label::before{content:'⚡';font-size:14px}
.clash-item{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid rgba(255,71,87,0.15)}
.clash-item:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.clash-speaker{font-weight:700;font-size:15px;color:var(--clash);margin-bottom:10px}
.clash-text{font-size:15px;line-height:1.9;color:var(--text-muted);letter-spacing:0.01em}

.insight-block{
  background:linear-gradient(135deg,var(--insight-glow) 0%,rgba(0,212,170,0.08) 100%);
  border:1px solid rgba(0,212,170,0.25);
  border-radius:var(--radius);
  padding:36px;
  position:relative;
  margin-bottom:24px;
  transition:all 0.4s cubic-bezier(0.16,1,0.3,1)
}
.insight-block::before{
  content:'';
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:5px;
  background:var(--insight);
  border-radius:5px 0 0 5px;
  box-shadow:0 0 24px rgba(0,212,170,0.6),-4px 0 20px rgba(0,212,170,0.4)
}
.insight-block::after{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:1px;
  background:linear-gradient(90deg,var(--insight),transparent 60%);
  opacity:0.6
}
.insight-block:hover{
  background:linear-gradient(135deg,rgba(0,212,170,0.15) 0%,rgba(0,212,170,0.1) 100%);
  border-color:rgba(0,212,170,0.4);
  box-shadow:0 8px 40px rgba(0,212,170,0.15)
}
.insight-label{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  color:var(--insight);
  letter-spacing:0.15em;
  text-transform:uppercase;
  margin-bottom:24px
}
.insight-label::before{content:'💡';font-size:14px}
.insight-core{
  font-family:var(--serif);
  font-size:clamp(1.2rem,2.5vw,1.6rem);
  font-weight:800;
  line-height:1.5;
  margin-bottom:20px;
  color:var(--text);
  letter-spacing:-0.01em
}
.insight-explain{font-size:15px;line-height:1.9;color:var(--text-muted);letter-spacing:0.01em}

.conclusions-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.conclusion-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:32px;
  display:flex;
  gap:24px;
  align-items:flex-start;
  transition:all 0.4s cubic-bezier(0.16,1,0.3,1);
  position:relative;
  overflow:hidden
}
.conclusion-card::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:2px;
  background:linear-gradient(90deg,var(--accent),transparent);
  opacity:0;
  transition:opacity 0.3s
}
.conclusion-card:hover{
  background:var(--bg-card-hover);
  border-color:var(--border-hover);
  transform:translateY(-6px);
  box-shadow:0 16px 40px rgba(0,0,0,0.3)
}
.conclusion-card:hover::before{opacity:1}
.conclusion-num{
  font-family:var(--serif);
  font-size:2.8rem;
  font-weight:800;
  color:var(--accent);
  opacity:0.25;
  line-height:1;
  flex-shrink:0
}
.conclusion-text{font-size:15px;line-height:1.85;color:var(--text-muted);letter-spacing:0.01em}

.questions-section{padding:80px 0}
.question-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:28px 32px;
  margin-bottom:16px;
  cursor:pointer;
  transition:all 0.4s cubic-bezier(0.16,1,0.3,1);
  position:relative;
  overflow:hidden
}
.question-card::after{
  content:'+';
  position:absolute;
  right:28px;
  top:50%;
  transform:translateY(-50%);
  font-size:28px;
  color:var(--text-faint);
  transition:all 0.3s
}
.question-card::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:2px;
  background:linear-gradient(90deg,var(--accent),transparent);
  opacity:0;
  transition:opacity 0.3s
}
.question-card:hover{
  background:var(--bg-card-hover);
  border-color:var(--accent);
  transform:translateX(8px);
  box-shadow:0 8px 24px rgba(255,107,53,0.1)
}
.question-card:hover::after{color:var(--accent);transform:translateY(-50%) rotate(45deg)}
.question-card:hover::before{opacity:1}
.question-card:hover .question-text{color:var(--text)}
.question-num{
  font-family:var(--serif);
  font-size:1.8rem;
  font-weight:800;
  color:var(--accent);
  opacity:0.3;
  margin-right:20px
}
.question-text{font-size:15px;line-height:1.85;font-weight:500;transition:color 0.3s;letter-spacing:0.01em}

.closing{text-align:center;padding:120px 0;position:relative}
.closing::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:300px;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent)}
.closing-title{
  font-family:var(--serif);
  font-size:clamp(1.8rem,4vw,3rem);
  font-weight:800;
  line-height:1.4;
  margin-bottom:28px;
  letter-spacing:-0.02em
}
.closing-note{font-size:16px;color:var(--text-muted);max-width:550px;margin:0 auto;line-height:1.9;letter-spacing:0.01em}

.progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),#ff8c5a);z-index:1000;transition:width 0.4s cubic-bezier(0.16,1,0.3,1);box-shadow:0 0 20px rgba(255,107,53,0.5)}
.nav-dots{position:fixed;right:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:100}
.nav-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--border);
  cursor:pointer;
  transition:all 0.4s cubic-bezier(0.16,1,0.3,1);
  border:none;
  padding:0
}
.nav-dot.active{
  background:var(--accent);
  height:28px;
  border-radius:5px;
  box-shadow:0 0 16px rgba(255,107,53,0.5)
}
.nav-dot:hover{background:rgba(255,255,255,0.4);transform:scale(1.2)}

@media(max-width:768px){
.hero{padding:100px 0 80px}
.hero-stats{gap:16px}
.stat{padding:20px 28px;min-width:100px}
.experts-grid{grid-template-columns:repeat(2,1fr)}
.conclusions-grid{grid-template-columns:1fr}
.section{padding:60px 0}
.nav-dots{display:none}
.container{padding:0 20px}
.speech-block,.clash-block,.insight-block{padding:24px 28px}
}
@media(max-width:480px){
.experts-grid{grid-template-columns:1fr}
.hero-title{font-size:2.8rem}
.stat-num{font-size:2.2rem}
.hero-stats{gap:12px}
.stat{padding:16px 20px}
}

@keyframes fadeInUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.animate{animation:fadeInUp 0.8s cubic-bezier(0.16,1,0.3,1) forwards}
.delay-1{animation-delay:0.1s}
.delay-2{animation-delay:0.2s}
.delay-3{animation-delay:0.3s}
.delay-4{animation-delay:0.4s}
.delay-5{animation-delay:0.5s}
.delay-6{animation-delay:0.6s}
.delay-7{animation-delay:0.7s}
</style>
</head>
<body>
<div class="progress-bar" id="progress"></div>
<div class="nav-dots" id="navDots"></div>

{{slides}}

<script>
(function(){
const sections=document.querySelectorAll('.section');
const total=sections.length;
let cur=0;
const dotsContainer=document.getElementById('navDots');
const progress=document.getElementById('progress');

sections.forEach((s,i)=>{
const dot=document.createElement('button');
dot.className='nav-dot'+(i===0?' active':'');
dot.onclick=()=>go(i);
dotsContainer.appendChild(dot);
});

function go(n){
if(n<0||n>=total)return;
sections[cur].classList.remove('visible');
dotsContainer.children[cur]?.classList.remove('active');
cur=n;
sections[cur].scrollIntoView({behavior:'smooth',block:'start'});
sections[cur].classList.add('visible');
dotsContainer.children[cur]?.classList.add('active');
const pct=Math.min(100,((cur+1)/total)*100);
progress.style.width=pct+'%';
}

document.addEventListener('keydown',e=>{
if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){
e.preventDefault();go(cur+1);
}else if(e.key==='ArrowUp'||e.key==='ArrowLeft'||e.key==='PageUp'){
e.preventDefault();go(cur-1);
}else if(e.key==='Home'){e.preventDefault();go(0);
}else if(e.key==='End'){e.preventDefault();go(total-1);
}
});

let wheelTimer=null;
document.addEventListener('wheel',e=>{
e.preventDefault();
if(wheelTimer)return;
wheelTimer=setTimeout(()=>wheelTimer=null,400);
if(e.deltaY>0)go(cur+1);
else if(e.deltaY<0)go(cur-1);
},{passive:false});

document.body.addEventListener('click',e=>{
if(e.target.closest('.nav-dot,.nav-dots,.expert-card,.speech-block,.clash-block,.insight-block,.question-card,.conclusion-card'))return;
go(cur+1);
});

const observer=new IntersectionObserver((entries)=>{
entries.forEach(e=>{
if(e.isIntersecting){
e.target.classList.add('visible');
const idx=Array.from(sections).indexOf(e.target);
if(idx!==cur){
cur=idx;
dotsContainer.children.forEach(d=>d.classList.remove('active'));
dotsContainer.children[idx]?.classList.add('active');
}
}
});
},{threshold:0.5});

sections.forEach(s=>observer.observe(s));
sections[0].classList.add('visible');
})();
</script>
</body>
</html>
