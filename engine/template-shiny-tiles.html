<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<style>
:root {
  --bg: #050505;
  --ink: #111113;
  --muted: #77777c;
  --panel: #e7e2df;
  --glass: rgba(255,255,255,0.68);
  --shadow: rgba(0,0,0,0.22);
  --accent: #c9a8f0;
  --glow: rgba(201,168,240,0.3);
  --sans: 'Inter', system-ui, -apple-system, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; }
body { display: flex; width: max-content; height: 100vh; background: var(--bg); font-family: var(--sans); color: #f4f4f2; }
.slide { width: 100vw; height: 100vh; min-width: 100vw; scroll-snap-align: start; display: flex; flex-direction: column; position: relative; background: radial-gradient(circle at 18% 8%, rgba(220,232,246,0.1), transparent 24%), radial-gradient(circle at 86% 16%, rgba(255,255,255,0.08), transparent 20%), var(--bg); }
.slide-cover { justify-content: center; align-items: center; text-align: center; }
.slide-dark { padding: 48px 64px; }
.frame { max-width: 720px; margin: 0 auto; width: 100%; }
.tile-card { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 24px; margin-bottom: 16px; box-shadow: 0 8px 32px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.2); }
.tile-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.tile-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #a8c9f0); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--bg); }
.tile-name { font-weight: 600; font-size: 14px; }
.tile-role { font-size: 11px; color: var(--muted); }
.tile-content { font-size: 14px; line-height: 1.8; color: rgba(255,255,255,0.8); }
.glow-insight { background: linear-gradient(135deg, var(--glow), rgba(168,201,240,0.15)); border: 1px solid var(--accent); border-radius: 16px; padding: 24px; margin-top: 16px; }
.glow-label { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.glow-text { font-size: 15px; line-height: 1.7; }
#nav { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; z-index: 100; background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); padding: 8px 16px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); }
.nav-btn { width: 32px; height: 32px; border: 1px solid rgba(255,255,255,0.15); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); border-radius: 50%; }
.nav-btn:hover { background: rgba(255,255,255,0.1); }
.dots { display: flex; gap: 4px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2); cursor: pointer; }
.dot.active { background: var(--accent); box-shadow: 0 0 8px var(--glow); }
#counter { position: fixed; top: 20px; right: 24px; font-size: 10px; color: var(--muted); z-index: 100; }
</style>
</head>
<body>
{{slides}}
<div id="nav">
  <button class="nav-btn" id="prevBtn">◀</button>
  <div class="dots" id="dots"></div>
  <button class="nav-btn" id="nextBtn">▶</button>
</div>
<div id="counter">1 / 1</div>
<script>
(function(){
  const slides = document.querySelectorAll('.slide');
  const total = slides.length;
  let cur = 0;
  const dots = document.getElementById('dots');
  const counter = document.getElementById('counter');
  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.onclick = () => go(i);
    dots.appendChild(d);
  });
  function go(n) {
    if (n < 0 || n >= total) return;
    slides[cur].style.display = 'none';
    dots.children[cur].classList.remove('active');
    cur = n;
    slides[cur].style.display = 'flex';
    dots.children[cur].classList.add('active');
    counter.textContent = (cur + 1) + ' / ' + total;
  }
  document.getElementById('prevBtn').onclick = () => go(cur - 1);
  document.getElementById('nextBtn').onclick = () => go(cur + 1);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') go(cur + 1);
    else if (e.key === 'ArrowLeft') go(cur - 1);
  });
  go(0);
})();
</script>
</body>
</html>
