<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #040608;
  --bg-elevated: #0a0e14;
  --fg: #f4f6f8;
  --fg-secondary: #9aa4b0;
  --muted: #6a7480;
  --blue: #4A8FE7;
  --blue-secondary: #3d7bd9;
  --blue-glow: rgba(74,143,231,0.35);
  --blue-soft: rgba(74,143,231,0.08);
  --ice: #E9EDF2;
  --ice-dark: #12161c;
  --ice-glow: rgba(233,237,242,0.12);
  --navy: #0A1628;
  --navy-mid: #1B3A6B;
  --navy-light: #2a4a7a;
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.08);
  --glass-hover: rgba(255,255,255,0.07);
  --clash-red: #ff5a6e;
  --clash-glow: rgba(255,90,110,0.25);
  --insight-green: #00e6b8;
  --insight-glow: rgba(0,230,184,0.25);
  --font-display: 'Outfit', 'Noto Serif SC', system-ui, sans-serif;
  --font-body: 'Noto Serif SC', 'Outfit', system-ui, serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--fg);
  overflow-x: hidden;
  overflow-y: hidden;
  line-height: 1.85;
  letter-spacing: 0.01em;
}
.slide {
  width: 100vw;
  height: 100vh;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  scroll-snap-align: start;
  opacity: 0;
  transform: translateY(30px);
  animation: slideReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes slideReveal {
  to { opacity: 1; transform: translateY(0); }
}
.slide.visible { opacity: 1; transform: translateY(0); }
.slide-cover {
  justify-content: center;
  align-items: center;
  text-align: center;
  background: 
    url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"),
    radial-gradient(ellipse at 40% 15%, rgba(74,143,231,0.22) 0%, transparent 50%),
    radial-gradient(ellipse at 60% 75%, rgba(233,237,242,0.12) 0%, transparent 35%),
    radial-gradient(ellipse at 85% 25%, rgba(27,58,107,0.15) 0%, transparent 30%),
    linear-gradient(180deg, var(--navy) 0%, var(--bg) 60%, #060810 100%);
  background-blend-mode: overlay, normal, normal, normal, normal;
  padding: 56px 32px;
  position: relative;
}
.slide-cover::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: 
    radial-gradient(circle at 15% 85%, rgba(74,143,231,0.08) 0%, transparent 20%),
    radial-gradient(circle at 85% 15%, rgba(233,237,242,0.06) 0%, transparent 18%);
  pointer-events: none;
}
.slide-cover::after {
  content: '';
  position: absolute;
  top: 20%;
  right: 10%;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, rgba(74,143,231,0.1) 0%, transparent 70%);
  filter: blur(40px);
  pointer-events: none;
}
.slide-ice {
  background: 
    url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"),
    linear-gradient(135deg, var(--ice-dark) 0%, var(--bg) 50%, #080c12 100%);
  background-blend-mode: overlay, normal;
  padding: 72px 56px;
  position: relative;
}
.slide-ice::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: 
    linear-gradient(90deg, transparent 0%, rgba(74,143,231,0.03) 50%, transparent 100%);
  pointer-events: none;
}
.slide-dark {
  background: 
    url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"),
    var(--bg);
  background-blend-mode: overlay, normal;
  padding: 72px 56px;
}
.frame {
  max-width: 1280px;
  margin: 0 auto;
  width: 100%;
}
.cover-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 40px;
  padding: 10px 24px;
  background: linear-gradient(135deg, rgba(74,143,231,0.12) 0%, rgba(74,143,231,0.04) 100%);
  border-radius: 100px;
  border: 1px solid rgba(74,143,231,0.25);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  animation: fadeSlideDown 0.6s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
}
@keyframes fadeSlideDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}
.cover-title {
  font-family: var(--font-display);
  font-size: clamp(52px, 9vw, 108px);
  font-weight: 800;
  line-height: 1.02;
  letter-spacing: -0.035em;
  margin-bottom: 28px;
  background: linear-gradient(135deg, var(--fg) 0%, var(--ice) 40%, var(--blue) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: fadeSlideUp 0.8s 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
}
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
.cover-subtitle {
  font-family: var(--font-body);
  font-size: clamp(18px, 2.2vw, 26px);
  font-weight: 400;
  color: var(--fg-secondary);
  margin-bottom: 56px;
  max-width: 680px;
  margin-left: auto;
  margin-right: auto;
  line-height: 1.75;
  letter-spacing: 0.02em;
  animation: fadeSlideUp 0.8s 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
}
.cover-stats {
  display: flex;
  justify-content: center;
  align-items: stretch;
  gap: 0;
  flex-wrap: wrap;
  margin-bottom: 56px;
  animation: fadeSlideUp 0.8s 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
}
.stat-item {
  text-align: center;
  padding: 0 36px;
  position: relative;
}
.stat-item:not(:last-child)::after {
  content: '';
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 1px;
  height: 48px;
  background: linear-gradient(180deg, transparent, rgba(74,143,231,0.3), transparent);
}
.stat-number {
  font-family: var(--font-display);
  font-size: clamp(42px, 6vw, 68px);
  font-weight: 800;
  color: var(--blue);
  line-height: 1;
  margin-bottom: 10px;
  letter-spacing: -0.02em;
}
.stat-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
}
.experts-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 56px;
  max-width: 960px;
  margin-left: auto;
  margin-right: auto;
}
.expert-card {
  background: linear-gradient(135deg, var(--glass) 0%, rgba(74,143,231,0.02) 100%);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 28px 24px;
  text-align: center;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
}
.expert-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(74,143,231,0.4), transparent);
  opacity: 0;
  transition: opacity 0.4s ease;
}
.expert-card:hover {
  background: linear-gradient(135deg, rgba(74,143,231,0.08) 0%, var(--glass-hover) 100%);
  border-color: rgba(74,143,231,0.35);
  transform: translateY(-8px);
  box-shadow: 
    0 20px 40px rgba(74,143,231,0.15),
    0 0 60px rgba(74,143,231,0.08);
}
.expert-card:hover::before {
  opacity: 1;
}
.expert-avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  margin: 0 auto 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 700;
  color: var(--bg);
  position: relative;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.expert-card:hover .expert-avatar {
  transform: scale(1.08);
  box-shadow: 0 0 30px currentColor;
}
.expert-avatar.expert-1 { background: linear-gradient(135deg, #4A8FE7 0%, #0066ff 100%); }
.expert-avatar.expert-2 { background: linear-gradient(135deg, #00d4aa 0%, #4A8FE7 100%); }
.expert-avatar.expert-3 { background: linear-gradient(135deg, #667eea 0%, #4A8FE7 100%); }
.expert-avatar.expert-4 { background: linear-gradient(135deg, #4facfe 0%, #4A8FE7 100%); }
.expert-avatar.expert-5 { background: linear-gradient(135deg, #43e97b 0%, #4A8FE7 100%); }
.expert-avatar.expert-6 { background: linear-gradient(135deg, #a8edea 0%, #4A8FE7 100%); }
.expert-name {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--fg);
  margin-bottom: 6px;
  letter-spacing: 0.01em;
}
.expert-role {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.section-header {
  margin-bottom: 56px;
  position: relative;
}
.section-label {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 18px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.section-label::before {
  content: '';
  width: 24px;
  height: 2px;
  background: linear-gradient(90deg, var(--blue), transparent);
}
.section-title {
  font-family: var(--font-display);
  font-size: clamp(36px, 5.5vw, 56px);
  font-weight: 800;
  line-height: 1.15;
  letter-spacing: -0.025em;
  background: linear-gradient(135deg, var(--fg) 0%, var(--fg-secondary) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.round-card {
  background: linear-gradient(135deg, var(--glass) 0%, rgba(74,143,231,0.02) 100%);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border);
  border-radius: 28px;
  padding: 36px;
  margin-bottom: 28px;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
}
.round-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--blue), transparent);
  opacity: 0.6;
}
.round-card:hover {
  border-color: rgba(74,143,231,0.25);
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(74,143,231,0.08);
}
.round-header {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 28px;
}
.round-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 8px 18px;
  border-radius: 100px;
  background: linear-gradient(135deg, rgba(74,143,231,0.18) 0%, rgba(74,143,231,0.08) 100%);
  color: var(--blue);
  border: 1px solid rgba(74,143,231,0.3);
}
.round-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  color: var(--fg);
  letter-spacing: -0.01em;
}
.speech-block {
  background: rgba(255,255,255,0.025);
  border-radius: 20px;
  padding: 28px;
  margin-bottom: 20px;
  border-left: 3px solid transparent;
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
}
.speech-block:hover {
  background: rgba(255,255,255,0.045);
  border-left-color: var(--blue);
  transform: translateX(4px);
}
.speech-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}
.speech-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  color: var(--bg);
}
.speech-name {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--fg);
}
.speech-role {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.05em;
}
.speech-content {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.9;
  color: rgba(255,255,255,0.88);
  letter-spacing: 0.015em;
}
.clash-block {
  background: linear-gradient(135deg, rgba(255,90,110,0.06) 0%, rgba(255,90,110,0.02) 100%);
  border-radius: 20px;
  padding: 28px 32px;
  margin-bottom: 20px;
  border-left: 4px solid var(--clash-red);
  position: relative;
  box-shadow: 
    inset 0 0 30px rgba(255,90,110,0.03),
    0 0 40px rgba(255,90,110,0.08);
}
.clash-block::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: linear-gradient(180deg, var(--clash-red), rgba(255,90,110,0.5));
  border-radius: 4px 0 0 4px;
  box-shadow: 0 0 20px var(--clash-glow);
}
.clash-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--clash-red);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.clash-label::before {
  content: '◆';
  font-size: 8px;
}
.clash-content {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.9;
  color: rgba(255,255,255,0.92);
  letter-spacing: 0.015em;
}
.insight-block {
  background: linear-gradient(135deg, rgba(0,230,184,0.06) 0%, rgba(0,230,184,0.02) 100%);
  border-radius: 20px;
  padding: 32px;
  margin-bottom: 20px;
  border-left: 4px solid var(--insight-green);
  position: relative;
  box-shadow: 
    inset 0 0 30px rgba(0,230,184,0.03),
    0 0 50px rgba(0,230,184,0.1);
}
.insight-block::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: linear-gradient(180deg, var(--insight-green), rgba(0,230,184,0.5));
  border-radius: 4px 0 0 4px;
  box-shadow: 0 0 25px var(--insight-glow);
}
.insight-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--insight-green);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.insight-label::before {
  content: '★';
  font-size: 10px;
}
.insight-text {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.9;
  color: rgba(255,255,255,0.95);
  letter-spacing: 0.015em;
}
.insight-core {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  color: var(--fg);
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid rgba(0,230,184,0.2);
  line-height: 1.6;
  letter-spacing: -0.01em;
}
.question-card {
  background: linear-gradient(135deg, var(--glass) 0%, rgba(74,143,231,0.02) 100%);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 28px;
  margin-bottom: 18px;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.question-card:hover {
  background: linear-gradient(135deg, rgba(74,143,231,0.08) 0%, var(--glass-hover) 100%);
  border-color: var(--blue);
  box-shadow: 
    0 8px 24px rgba(74,143,231,0.12),
    inset 0 0 20px rgba(74,143,231,0.03);
}
.question-card:hover .question-expand {
  max-height: 600px;
  opacity: 1;
  margin-top: 20px;
}
.question-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.question-text {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  color: var(--fg);
  letter-spacing: -0.01em;
}
.question-icon {
  font-size: 22px;
  color: var(--blue);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.question-card:hover .question-icon {
  transform: rotate(45deg) scale(1.1);
}
.question-expand {
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}
.question-answer {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.9;
  color: rgba(255,255,255,0.75);
  letter-spacing: 0.015em;
}
.conclusion-card {
  background: linear-gradient(135deg, rgba(74,143,231,0.12) 0%, rgba(233,237,242,0.06) 100%);
  border: 1px solid rgba(74,143,231,0.25);
  border-radius: 32px;
  padding: 52px 48px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.conclusion-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--blue), transparent);
}
.conclusion-label {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 24px;
}
.conclusion-text {
  font-family: var(--font-display);
  font-size: clamp(22px, 3.5vw, 32px);
  font-weight: 700;
  line-height: 1.55;
  color: var(--fg);
  letter-spacing: -0.01em;
}
.blue-bar {
  position: absolute;
  top: 0;
  right: 0;
  width: 4px;
  height: 48px;
  background: linear-gradient(180deg, var(--blue), rgba(74,143,231,0.3));
  box-shadow: 0 0 15px var(--blue-glow);
}
.blue-bar-left {
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 48px;
  background: linear-gradient(180deg, var(--blue), rgba(74,143,231,0.3));
  box-shadow: 0 0 15px var(--blue-glow);
}
.photo-card {
  background: linear-gradient(135deg, var(--glass) 0%, rgba(74,143,231,0.02) 100%);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 20px;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.photo-card:hover {
  border-color: rgba(74,143,231,0.3);
  transform: translateY(-4px);
  box-shadow: 0 12px 28px rgba(74,143,231,0.1);
}
.photo-placeholder {
  height: 140px;
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 50%, var(--navy-light) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--blue);
  font-family: var(--font-mono);

  font-weight: 600;

.photo-placeholder::before {

  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: radial-gradient(ellipse at 50% 50%, rgba(74,143,231,0.1) 0%, transparent 60%);

.photo-body {
  padding: 24px;
}
.photo-speaker {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 16px;
  margin-bottom: 6px;

}
.photo-role {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--blue);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 14px;
}
.photo-content {
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.85;
  color: rgba(255,255,255,0.8);
  letter-spacing: 0.015em;
}
.studio-insight {
  background: linear-gradient(135deg, rgba(74,143,231,0.1), transparent);
  border-left: 4px solid var(--blue);
  padding: 24px;
  margin-top: 20px;

}

}
.studio-label {

  font-size: 10px;
  letter-spacing: 0.18em;

.studio-text {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.85;
  color: rgba(255,255,255,0.9);

}
.page-marker {
  position: absolute;
  bottom: 36px;
  left: 56px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: rgba(255,255,255,0.35);
  letter-spacing: 0.05em;
}
.brand-mark {
  position: absolute;
  bottom: 36px;
  right: 56px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  opacity: 0.35;
  color: var(--blue);
}
#nav {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 18px;
  z-index: 1000;
  background: rgba(10,14,20,0.75);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  padding: 14px 24px;
  border-radius: 100px;
  border: 1px solid rgba(74,143,231,0.15);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.nav-btn {
  width: 40px;
  height: 40px;
  border: 1px solid rgba(74,143,231,0.2);
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--fg-secondary);
  border-radius: 50%;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.nav-btn:hover {
  background: rgba(74,143,231,0.15);
  border-color: var(--blue);
  color: var(--blue);
  transform: scale(1.08);
}
.dots {
  display: flex;
  gap: 10px;
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  cursor: pointer;
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
.dot:hover {
  background: rgba(255,255,255,0.35);
}
.dot.active {
  background: var(--blue);
  box-shadow: 0 0 16px var(--blue-glow);
  transform: scale(1.3);
}
#progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--blue), var(--ice), #00d4aa);
  z-index: 1001;
  transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 0 12px var(--blue-glow);
}
#counter {
  position: fixed;
  top: 28px;
  right: 36px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  z-index: 100;
  background: rgba(10,14,20,0.6);
  padding: 10px 20px;
  border-radius: 100px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(74,143,231,0.1);
}
@media (max-width: 768px) {
  .slide-ice, .slide-dark { padding: 40px 24px; }
  .slide-cover { padding: 40px 20px; }
  .cover-stats { gap: 0; }
  .stat-item { padding: 0 24px; }
  .stat-item:not(:last-child)::after { height: 36px; }
  .experts-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .round-card { padding: 24px; }
  .frame { padding: 0 16px; }
  #nav { bottom: 20px; padding: 12px 18px; gap: 14px; }
  .nav-btn { width: 36px; height: 36px; }
  .conclusion-card { padding: 36px 28px; }
  .photo-placeholder { height: 100px; }
}
</style>
</head>
<body>
<div id="progress"></div>
{{slides}}
<div id="nav">
  <button class="nav-btn" id="prevBtn">◀</button>
  <div class="dots" id="dots"></div>
  <button class="nav-btn" id="nextBtn">▶</button>
</div>
<div id="counter">1 / 1</div>
<script>
(function(){
  const slides = document.querySelectorAll('.slide');
  const total = slides.length;
  let cur = 0;
  let wheelTimer = null;
  const dots = document.getElementById('dots');
  const counter = document.getElementById('counter');
  const progress = document.getElementById('progress');
  
  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.onclick = () => go(i);
    dots.appendChild(d);
  });
  
  function go(n) {
    if (n < 0 || n >= total) return;
    slides[cur].classList.remove('visible');
    dots.children[cur].classList.remove('active');
    cur = n;
    slides[cur].scrollIntoView({ behavior: 'smooth', block: 'start' });
    slides[cur].classList.add('visible');
    dots.children[cur].classList.add('active');
    counter.textContent = (cur + 1) + ' / ' + total;
    const pct = Math.min(100, ((cur + 1) / total) * 100);
    progress.style.width = pct + '%';
  }
  
  document.getElementById('prevBtn').onclick = () => go(cur - 1);
  document.getElementById('nextBtn').onclick = () => go(cur + 1);
  
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
      e.preventDefault();
      go(cur + 1);
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault();
      go(cur - 1);
    } else if (e.key === 'Home') {
      e.preventDefault();
      go(0);
    } else if (e.key === 'End') {
      e.preventDefault();
      go(total - 1);
    }
  });
  
  document.addEventListener('wheel', e => {
    e.preventDefault();
    if (wheelTimer) return;
    wheelTimer = setTimeout(() => wheelTimer = null, 400);
    if (e.deltaY > 0) go(cur + 1);
    else if (e.deltaY < 0) go(cur - 1);
  }, { passive: false });
  
  document.body.addEventListener('click', e => {
    if (e.target.closest('.nav-btn, .dot, .expert-card, .speech-block, .clash-block, .insight-block, .question-card, .conclusion-card, .photo-card, #nav, #counter')) return;
    go(cur + 1);
  });
  
  go(0);
})();
</script>
</body>
</html>
