<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<style>
:root {
  --black: #000000;
  --white: #FFFFFF;
  --navy: #0A1628;
  --navy-mid: #1B3A6B;
  --blue: #4A8FE7;
  --ice: #E9EDF2;
  --gray-800: #1A1E2A;
  --gray-600: #484E5A;
  --gray-400: #949DAE;
  --sans: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; }
body { display: flex; width: max-content; height: 100vh; background: var(--black); font-family: var(--sans); color: var(--white); }
.slide { width: 100vw; height: 100vh; min-width: 100vw; scroll-snap-align: start; display: flex; flex-direction: column; position: relative; }
.slide-cover { justify-content: center; align-items: center; text-align: center; background: var(--navy); }
.slide-ice { background: var(--ice); color: var(--black); }
.slide-white { background: var(--white); color: var(--black); }
.slide-dark { background: var(--gray-800); color: var(--white); }
.frame { max-width: 800px; margin: 0 auto; width: 100%; }
.cover-badge { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--blue); margin-bottom: 24px; }
.cover-title { font-size: clamp(32px, 5vw, 56px); font-weight: 900; line-height: 1.1; margin-bottom: 20px; }
.cover-sub { font-size: 16px; font-weight: 300; color: var(--gray-400); margin-bottom: 32px; }
.cover-stats { display: flex; justify-content: center; gap: 40px; }
.cover-stat { text-align: center; }
.cover-stat-num { font-size: 36px; font-weight: 900; color: var(--blue); }
.cover-stat-label { font-size: 11px; color: var(--gray-400); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; }
.blue-bar { position: absolute; top: 0; right: 0; width: 4px; height: 48px; background: var(--blue); }
.blue-bar-left { position: absolute; top: 0; left: 0; width: 4px; height: 48px; background: var(--blue); }
.photo-card { background: var(--white); border-radius: 8px; overflow: hidden; margin-bottom: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
.photo-placeholder { height: 120px; background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%); display: flex; align-items: center; justify-content: center; color: var(--blue); font-size: 12px; }
.photo-body { padding: 20px; }
.photo-speaker { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
.photo-role { font-size: 11px; color: var(--blue); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; }
.photo-content { font-size: 14px; line-height: 1.8; color: var(--gray-600); }
.studio-insight { background: linear-gradient(135deg, rgba(74,143,231,0.1), transparent); border-left: 4px solid var(--blue); padding: 20px; margin-top: 16px; }
.studio-label { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--blue); margin-bottom: 8px; }
.studio-text { font-size: 15px; line-height: 1.7; color: var(--gray-800); }
.page-marker { position: absolute; bottom: 32px; left: 48px; font-size: 11px; color: rgba(255,255,255,0.4); }
.brand-mark { position: absolute; bottom: 32px; right: 48px; font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.4; }
#nav { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; z-index: 100; }
.nav-btn { width: 36px; height: 36px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; color: rgba(255,255,255,0.6); }
.nav-btn:hover { background: rgba(74,143,231,0.2); border-color: var(--blue); }
.dots { display: flex; gap: 6px; }
.dot { width: 6px; height: 6px; border-radius: 0; background: rgba(255,255,255,0.2); cursor: pointer; }
.dot.active { background: var(--blue); }
#counter { position: fixed; top: 20px; right: 24px; font-size: 11px; color: rgba(255,255,255,0.4); z-index: 100; }
</style>
</head>
<body>
{{slides}}
<div id="nav">
  <button class="nav-btn" id="prevBtn">◀</button>
  <div class="dots" id="dots"></div>
  <button class="nav-btn" id="nextBtn">▶</button>
</div>
<div id="counter">1 / 1</div>
<script>
(function(){
  const slides = document.querySelectorAll('.slide');
  const total = slides.length;
  let cur = 0;
  const dots = document.getElementById('dots');
  const counter = document.getElementById('counter');
  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.onclick = () => go(i);
    dots.appendChild(d);
  });
  function go(n) {
    if (n < 0 || n >= total) return;
    slides[cur].style.display = 'none';
    dots.children[cur].classList.remove('active');
    cur = n;
    slides[cur].style.display = 'flex';
    dots.children[cur].classList.add('active');
    counter.textContent = (cur + 1) + ' / ' + total;
  }
  document.getElementById('prevBtn').onclick = () => go(cur - 1);
  document.getElementById('nextBtn').onclick = () => go(cur + 1);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') go(cur + 1);
    else if (e.key === 'ArrowLeft') go(cur - 1);
  });
  go(0);
})();
</script>
</body>
</html>
