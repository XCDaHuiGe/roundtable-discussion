<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fff8f0;
  --paper: #ffffff;
  --ink: #2d2926;
  --soft: #a09080;
  --accent: #e8a87c;
  --gold: #d4a574;
  --line: rgba(45,41,38,0.1);
  --serif: 'Noto Serif SC', Georgia, serif;
  --sans: 'Noto Sans SC', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; }
body { display: flex; width: max-content; height: 100vh; background: var(--bg); font-family: var(--sans); }
.slide { width: 100vw; height: 100vh; min-width: 100vw; scroll-snap-align: start; display: flex; flex-direction: column; position: relative; }
.slide-cover { justify-content: center; align-items: center; text-align: center; }
.slide-white { padding: 48px 64px; }
.frame { max-width: 680px; margin: 0 auto; width: 100%; }
.cover-badge { display: inline-block; padding: 6px 16px; border: 1px solid var(--accent); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); margin-bottom: 32px; }
.cover-title { font-family: var(--serif); font-size: clamp(32px, 5vw, 52px); font-weight: 400; line-height: 1.3; margin-bottom: 24px; letter-spacing: 0.02em; }
.cover-sub { font-size: 15px; color: var(--soft); line-height: 1.8; max-width: 480px; margin: 0 auto 32px; }
.cover-stats { display: flex; justify-content: center; gap: 40px; }
.cover-stat { text-align: center; }
.cover-stat-num { font-family: var(--serif); font-size: 36px; font-weight: 300; color: var(--accent); }
.cover-stat-label { font-size: 10px; color: var(--soft); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; }
.section-header { margin-bottom: 28px; }
.section-tag { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; display: block; }
.section-title { font-family: var(--serif); font-size: 26px; font-weight: 400; line-height: 1.4; }
.sun-card { background: var(--paper); border-radius: 12px; padding: 28px; margin-bottom: 16px; box-shadow: 0 4px 24px rgba(232,168,124,0.08); }
.sun-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.sun-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--gold)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 14px; }
.sun-name { font-weight: 600; font-size: 14px; }
.sun-role { font-size: 12px; color: var(--soft); }
.sun-content { font-size: 14px; line-height: 1.9; color: var(--ink); }
.sun-insight { background: linear-gradient(135deg, rgba(232,168,124,0.12), rgba(212,165,116,0.08)); border-radius: 12px; padding: 24px; margin-top: 16px; }
.sun-insight-label { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
.sun-insight-text { font-family: var(--serif); font-size: 15px; line-height: 1.7; font-weight: 400; }
#nav { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; z-index: 100; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); padding: 8px 16px; border-radius: 24px; }
.nav-btn { width: 32px; height: 32px; border: none; background: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--soft); border-radius: 50%; }
.nav-btn:hover { background: var(--line); }
.dots { display: flex; gap: 4px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); cursor: pointer; }
.dot.active { background: var(--accent); }
#counter { position: fixed; top: 20px; right: 24px; font-size: 11px; color: var(--soft); z-index: 100; }
</style>
</head>
<body>
{{slides}}
<div id="nav">
  <button class="nav-btn" id="prevBtn">◀</button>
  <div class="dots" id="dots"></div>
  <button class="nav-btn" id="nextBtn">▶</button>
</div>
<div id="counter">1 / 1</div>
<script>
(function(){
  const slides = document.querySelectorAll('.slide');
  const total = slides.length;
  let cur = 0;
  const dots = document.getElementById('dots');
  const counter = document.getElementById('counter');
  
  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.onclick = () => go(i);
    dots.appendChild(d);
  });
  
  function go(n) {
    if (n < 0 || n >= total) return;
    slides[cur].style.display = 'none';
    dots.children[cur].classList.remove('active');
    cur = n;
    slides[cur].style.display = 'flex';
    dots.children[cur].classList.add('active');
    counter.textContent = (cur + 1) + ' / ' + total;
  }
  
  document.getElementById('prevBtn').onclick = () => go(cur - 1);
  document.getElementById('nextBtn').onclick = () => go(cur + 1);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') go(cur + 1);
    else if (e.key === 'ArrowLeft') go(cur - 1);
  });
  
  go(0);
})();
</script>
</body>
</html>
