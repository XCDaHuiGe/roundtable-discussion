<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000000;
  --surface: rgba(12, 12, 12, 0.95);
  --surface-solid: #0c0c0c;
  --text: #e8e8e8;
  --dim: #707070;
  --chrome: #c0c0c0;
  --accent: #ff00ff;
  --cyan: #00ffff;
  --accent-glow: rgba(255, 0, 255, 0.45);
  --cyan-glow: rgba(0, 255, 255, 0.45);
  --clash-red: #ff4757;
  --clash-glow: rgba(255, 71, 87, 0.3);
  --insight-green: #00d4aa;
  --insight-glow: rgba(0, 212, 170, 0.3);
  --mono: 'JetBrains Mono', 'Fira Code', monospace;
  --serif: 'Noto Serif SC', Georgia, serif;
  --sans: 'Outfit', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  font-family: var(--sans);
  color: var(--text);
  overflow: hidden;
  opacity: 0;
  animation: fadeIn 0.8s ease forwards;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes staggerFadeIn {
  from { opacity: 0; transform: translateY(28px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes neonPulse {
  0%, 100% { filter: drop-shadow(0 0 25px var(--accent-glow)) drop-shadow(0 0 50px rgba(255, 0, 255, 0.2)); }
  50% { filter: drop-shadow(0 0 40px var(--cyan-glow)) drop-shadow(0 0 80px rgba(0, 255, 255, 0.25)); }
}
@keyframes glitchText {
  0%, 85%, 100% { 
    text-shadow: 0 0 30px var(--accent-glow), 0 0 60px rgba(255, 0, 255, 0.3);
    transform: translateX(0);
  }
  86% { 
    text-shadow: 3px 0 var(--cyan), -3px 0 var(--accent);
    transform: translateX(-2px);
  }
  88% { 
    text-shadow: -3px 0 var(--cyan), 3px 0 var(--accent);
    transform: translateX(2px);
  }
  90% { 
    text-shadow: 2px 0 #ff6b6b, -2px 0 var(--cyan);
    transform: translateX(-1px);
  }
  92% { 
    text-shadow: -2px 0 #ff6b6b, 2px 0 var(--accent);
    transform: translateX(1px);
  }
}
@keyframes scanlineMove {
  0% { transform: translateY(-100%); }
  100% { transform: translateY(100vh); }
}
@keyframes avatarGlow {
  0%, 100% { box-shadow: 0 0 25px var(--accent-glow), 0 0 50px rgba(255, 0, 255, 0.2); }
  50% { box-shadow: 0 0 35px var(--cyan-glow), 0 0 70px rgba(0, 255, 255, 0.25), inset 0 0 20px rgba(255, 255, 255, 0.1); }
}
.scanline {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: repeating-linear-gradient(0deg, 
    rgba(0,0,0,0.18) 0px, 
    rgba(0,0,0,0.18) 1px, 
    transparent 1px, 
    transparent 3px
  );
  pointer-events: none;
  z-index: 1000;
  opacity: 0.35;
}
.scanline::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 8px;
  background: linear-gradient(180deg, rgba(0, 255, 255, 0.08) 0%, transparent 100%);
  animation: scanlineMove 8s linear infinite;
  pointer-events: none;
}
.slides-container {
  height: 100vh;
  overflow: hidden;
  position: relative;
}
.slide {
  width: 100%;
  height: 100vh;
  display: none;
  flex-direction: column;
  position: relative;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.slide.visible {
  display: flex;
  opacity: 1;
  transform: translateY(0);
}
.slide::before {
  content: '';
  position: absolute;
  inset: 0;
  background: 
    radial-gradient(ellipse at 30% 10%, rgba(255, 0, 255, 0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 90%, rgba(0, 255, 255, 0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(255, 0, 255, 0.04) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
.frame {
  position: relative;
  z-index: 2;
  max-width: 1140px;
  margin: 0 auto;
  width: 100%;
  padding: 0 48px;
}
.slide-cover {
  justify-content: center;
  align-items: center;
  text-align: center;
}
.slide-cover .frame {
  max-width: 920px;
}
.main-title {
  font-size: clamp(52px, 11vw, 108px);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.05;
  margin-bottom: 28px;
  background: linear-gradient(135deg, #ffffff 0%, var(--cyan) 35%, var(--accent) 70%, #ff6b6b 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: staggerFadeIn 0.8s ease forwards, glitchText 4s ease-in-out infinite;
  animation-delay: 0.1s, 0s;
  opacity: 0;
}
.main-subtitle {
  font-family: var(--mono);
  font-size: clamp(14px, 2.8vw, 20px);
  color: var(--dim);
  font-weight: 400;
  margin-bottom: 56px;
  line-height: 1.7;
  letter-spacing: 0.06em;
  animation: staggerFadeIn 0.8s ease forwards;
  animation-delay: 0.25s;
  opacity: 0;
}
.glitch-badge {
  display: inline-block;
  padding: 10px 28px;
  border: 1px solid var(--accent);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
  animation: glitch 2.5s infinite;
  margin-bottom: 44px;
  background: rgba(255, 0, 255, 0.08);
  box-shadow: 0 0 20px var(--accent-glow), inset 0 0 15px rgba(255, 0, 255, 0.1);
  animation: staggerFadeIn 0.8s ease forwards;
  animation-delay: 0.15s;
  opacity: 0;
}
@keyframes glitch {
  0%, 88%, 100% { 
    text-shadow: none; 
    box-shadow: 0 0 20px var(--accent-glow), inset 0 0 15px rgba(255, 0, 255, 0.1);
    border-color: var(--accent);
  }
  90% { 
    text-shadow: 3px 0 var(--cyan), -3px 0 var(--accent); 
    box-shadow: 0 0 30px var(--cyan-glow), inset 0 0 20px rgba(0, 255, 255, 0.15);
    border-color: var(--cyan);
  }
  92% { 
    text-shadow: -3px 0 var(--cyan), 3px 0 var(--accent); 
    box-shadow: 0 0 30px var(--accent-glow), inset 0 0 20px rgba(255, 0, 255, 0.15);
    border-color: #ff6b6b;
  }
}
.stats-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 0;
  flex-wrap: wrap;
  margin-bottom: 56px;
  animation: staggerFadeIn 0.8s ease forwards;
  animation-delay: 0.4s;
  opacity: 0;
}
.stat-item {
  text-align: center;
  padding: 0 40px;
  position: relative;
}
.stat-item:not(:last-child)::after {
  content: '';
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 1px;
  height: 56px;
  background: linear-gradient(180deg, transparent, var(--accent), var(--cyan), transparent);
  box-shadow: 0 0 8px var(--accent-glow);
}
.stat-number {
  font-size: clamp(48px, 8vw, 68px);
  font-weight: 800;
  color: var(--accent);
  line-height: 1;
  margin-bottom: 12px;
  font-family: var(--sans);
  letter-spacing: -0.02em;
  text-shadow: 0 0 30px var(--accent-glow);
  animation: neonPulse 3s ease-in-out infinite;
}
.stat-item:nth-child(even) .stat-number {
  color: var(--cyan);
  text-shadow: 0 0 30px var(--cyan-glow);
}
.stat-label {
  font-size: 12px;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.18em;
  font-family: var(--mono);
}
.experts-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
  margin-top: 44px;
  animation: staggerFadeIn 0.8s ease forwards;
  animation-delay: 0.55s;
  opacity: 0;
}
.expert-card {
  background: var(--surface);
  border-radius: 18px;
  padding: 32px 24px;
  text-align: center;
  border: 1px solid rgba(192, 192, 192, 0.18);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}
.expert-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--cyan), var(--accent));
  opacity: 0;
  transition: opacity 0.4s ease;
}
.expert-card::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(135deg, rgba(255, 0, 255, 0.03) 0%, rgba(0, 255, 255, 0.02) 100%);
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
}
.expert-card:hover {
  transform: translateY(-8px) scale(1.02);
  box-shadow: 
    0 0 40px var(--accent-glow),
    0 20px 50px rgba(255, 0, 255, 0.15),
    0 0 0 1px var(--accent);
  border-color: var(--accent);
}
.expert-card:hover::before {
  opacity: 1;
}
.expert-card:hover::after {
  opacity: 1;
}
.expert-avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  margin: 0 auto 20px;
  background: linear-gradient(145deg, var(--accent) 0%, var(--cyan) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: 700;
  color: var(--bg);
  box-shadow: 0 0 30px var(--accent-glow);
  transition: all 0.4s ease;
  position: relative;
}
.expert-card:hover .expert-avatar {
  animation: avatarGlow 2s ease-in-out infinite;
  transform: scale(1.05);
}
.expert-name {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 6px;
  letter-spacing: 0.01em;
}
.expert-role {
  font-size: 10px;
  color: var(--cyan);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-family: var(--mono);
}
.slide-content {
  padding: 64px 0;
  justify-content: flex-start;
  overflow: hidden;
}
.window {
  background: var(--surface);
  border: 1px solid var(--chrome);
  box-shadow: 
    5px 5px 0 rgba(192, 192, 192, 0.25),
    0 0 50px rgba(255, 0, 255, 0.12),
    inset 0 0 30px rgba(0, 0, 0, 0.3);
  margin-bottom: 28px;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
}
.window::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--cyan), transparent);
}
.window-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px;
  background: linear-gradient(180deg, rgba(192, 192, 192, 0.18) 0%, rgba(192, 192, 192, 0.05) 100%);
  border-bottom: 1px solid rgba(192, 192, 192, 0.18);
}
.window-title {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--chrome);
  letter-spacing: 0.12em;
}
.window-dots {
  display: flex;
  gap: 8px;
}
.window-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  box-shadow: 0 0 8px currentColor;
}
.window-dot:nth-child(1) { background: #ff5f56; color: rgba(255, 95, 56, 0.5); }
.window-dot:nth-child(2) { background: #ffbd2e; color: rgba(255, 189, 46, 0.5); }
.window-dot:nth-child(3) { background: #27ca40; color: rgba(39, 202, 64, 0.5); }
.window-body {
  padding: 32px;
}
.round-card {
  background: var(--surface);
  border-radius: 20px;
  padding: 36px;
  margin-bottom: 28px;
  border: 1px solid rgba(192, 192, 192, 0.12);
  backdrop-filter: blur(12px);
  position: relative;
  overflow: hidden;
}
.round-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent 0%, var(--accent) 25%, var(--cyan) 50%, var(--accent) 75%, transparent 100%);
  box-shadow: 0 0 15px var(--accent-glow);
}
.round-header {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 28px;
}
.round-badge {
  background: linear-gradient(135deg, var(--accent) 0%, var(--cyan) 100%);
  color: var(--bg);
  padding: 8px 20px;
  border-radius: 24px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-family: var(--mono);
  box-shadow: 0 0 20px var(--accent-glow);
}
.round-theme {
  font-size: 19px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.01em;
}
.speech-block {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 24px;
  padding: 24px 0;
  border-bottom: 1px solid rgba(192, 192, 192, 0.08);
  transition: all 0.3s ease;
}
.speech-block:last-child {
  border-bottom: none;
}
.speech-block:hover {
  background: rgba(255, 0, 255, 0.04);
  margin: 0 -16px;
  padding-left: 16px;
  padding-right: 16px;
  border-radius: 12px;
}
.speech-speaker {
  font-weight: 600;
  font-size: 16px;
  color: var(--text);
  letter-spacing: 0.01em;
}
.speech-role {
  font-size: 10px;
  color: var(--cyan);
  display: block;
  margin-top: 6px;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.speech-content {
  font-size: 15px;
  line-height: 1.9;
  color: var(--dim);
  letter-spacing: 0.01em;
}
.clash-block {
  background: rgba(255, 71, 87, 0.08);
  border-left: 4px solid var(--clash-red);
  border-radius: 0 20px 20px 0;
  padding: 28px 32px;
  margin: 28px 0;
  position: relative;
  box-shadow: 
    inset 10px 0 30px rgba(255, 71, 87, 0.1),
    0 6px 28px rgba(255, 71, 87, 0.12),
    0 0 0 1px rgba(255, 71, 87, 0.15);
}
.clash-block::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(180deg, transparent, var(--clash-red), transparent);
  opacity: 0.7;
  box-shadow: 0 0 10px var(--clash-glow);
}
.clash-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  color: var(--clash-red);
  margin-bottom: 14px;
  font-weight: 600;
  font-family: var(--mono);
  text-shadow: 0 0 10px var(--clash-glow);
}
.clash-content {
  font-size: 15px;
  line-height: 1.85;
  color: var(--text);
  letter-spacing: 0.01em;
}
.insight-block {
  background: rgba(0, 212, 170, 0.08);
  border-left: 4px solid var(--insight-green);
  border-radius: 0 20px 20px 0;
  padding: 28px 32px;
  margin: 28px 0;
  position: relative;
  box-shadow: 
    inset 10px 0 30px rgba(0, 212, 170, 0.1),
    0 6px 28px rgba(0, 212, 170, 0.12),
    0 0 0 1px rgba(0, 212, 170, 0.15);
}
.insight-block::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(180deg, transparent, var(--insight-green), transparent);
  opacity: 0.7;
  box-shadow: 0 0 10px var(--insight-glow);
}
.insight-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  color: var(--insight-green);
  margin-bottom: 14px;
  font-weight: 600;
  font-family: var(--mono);
  text-shadow: 0 0 10px var(--insight-glow);
}
.insight-core {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.55;
  margin-bottom: 14px;
  letter-spacing: 0.01em;
}
.insight-detail {
  font-size: 15px;
  line-height: 1.85;
  color: var(--dim);
  letter-spacing: 0.01em;
}
.question-card {
  background: var(--surface);
  border-radius: 14px;
  margin-bottom: 18px;
  overflow: hidden;
  border: 1px solid rgba(192, 192, 192, 0.12);
  transition: all 0.35s ease;
}
.question-card:hover {
  border-color: var(--accent);
  box-shadow: 
    0 0 25px var(--accent-glow),
    0 8px 32px rgba(255, 0, 255, 0.1);
}
.question-header {
  padding: 24px 28px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all 0.3s ease;
  background: linear-gradient(180deg, rgba(192, 192, 192, 0.06) 0%, transparent 100%);
}
.question-header:hover {
  background: rgba(255, 0, 255, 0.06);
}
.question-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  font-family: var(--mono);
  letter-spacing: 0.02em;
}
.question-icon {
  font-size: 20px;
  color: var(--accent);
  transition: transform 0.35s ease;
  text-shadow: 0 0 12px var(--accent-glow);
}
.question-card.open .question-icon {
  transform: rotate(45deg);
}
.question-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.45s ease, padding 0.45s ease;
}
.question-card.open .question-body {
  max-height: 600px;
  padding: 0 28px 28px;
}
.question-text {
  font-size: 14px;
  line-height: 1.85;
  color: var(--dim);
  letter-spacing: 0.01em;
}
.conclusion-card {
  background: linear-gradient(145deg, rgba(255, 0, 255, 0.12) 0%, rgba(0, 255, 255, 0.06) 100%);
  border-radius: 24px;
  padding: 48px;
  text-align: center;
  border: 1px solid rgba(255, 0, 255, 0.35);
  margin-top: 48px;
  position: relative;
  overflow: hidden;
  box-shadow: 
    0 0 40px var(--accent-glow),
    inset 0 0 30px rgba(255, 0, 255, 0.05);
}
.conclusion-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 280px;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--cyan), var(--accent), transparent);
  box-shadow: 0 0 20px var(--accent-glow);
}
.conclusion-card::after {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 24px;
  padding: 1px;
  background: linear-gradient(135deg, var(--accent), var(--cyan), var(--accent));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: 0.4;
  pointer-events: none;
}
.conclusion-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--cyan);
  margin-bottom: 20px;
  text-shadow: 0 0 10px var(--cyan-glow);
}
.conclusion-text {
  font-size: clamp(20px, 3.5vw, 30px);
  line-height: 1.7;
  color: var(--text);
  font-weight: 500;
  letter-spacing: 0.02em;
}
#nav {
  position: fixed;
  bottom: 36px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 18px;
  z-index: 100;
  background: var(--surface-solid);
  padding: 12px 24px;
  border-radius: 36px;
  border: 1px solid var(--chrome);
  box-shadow: 
    0 0 30px var(--accent-glow),
    0 8px 32px rgba(0, 0, 0, 0.5);
}
.nav-btn {
  width: 40px;
  height: 40px;
  border: 1px solid var(--chrome);
  background: var(--bg);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--chrome);
  font-family: var(--mono);
  border-radius: 50%;
  transition: all 0.3s ease;
}
.nav-btn:hover {
  background: var(--surface);
  box-shadow: 0 0 20px var(--accent-glow);
  border-color: var(--accent);
  color: var(--accent);
}
.nav-dots {
  display: flex;
  gap: 10px;
}
.nav-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--dim);
  cursor: pointer;
  transition: all 0.3s ease;
  border: none;
  padding: 0;
}
.nav-dot:hover {
  background: var(--cyan);
  box-shadow: 0 0 12px var(--cyan-glow);
}
.nav-dot.active {
  background: var(--accent);
  box-shadow: 0 0 18px var(--accent-glow);
  transform: scale(1.35);
}
#progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--cyan) 50%, var(--accent) 100%);
  z-index: 1001;
  transition: width 0.35s ease;
  box-shadow: 0 0 15px var(--accent-glow);
}
#counter {
  position: fixed;
  top: 28px;
  right: 36px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  z-index: 100;
  letter-spacing: 0.12em;
  text-shadow: 0 0 8px rgba(0, 255, 255, 0.3);
}
@media (max-width: 768px) {
  .frame { padding: 0 24px; }
  .experts-grid { grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .stats-row { gap: 0; }
  .stat-item { padding: 0 28px; }
  .stat-number { font-size: 44px; }
  .speech-block { grid-template-columns: 90px 1fr; gap: 16px; }
  .round-card { padding: 24px; }
  .window-body { padding: 24px; }
  .slide-content { padding: 48px 0; }
  .conclusion-card { padding: 36px; }
}
@media (max-width: 480px) {
  .experts-grid { grid-template-columns: 1fr; }
  .window-header { flex-direction: column; align-items: flex-start; gap: 10px; }
  .stat-item:not(:last-child)::after { height: 40px; }
}
</style>
</head>
<body>
<div class="scanline"></div>
<div id="progress"></div>
<div class="slides-container">
{{slides}}
</div>
<div id="nav">
  <button class="nav-btn" id="prevBtn" aria-label="上一页">◀</button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn" aria-label="下一页">▶</button>
</div>
<div id="counter">1 / 1</div>
<script>
(function(){
  const container = document.querySelector('.slides-container');
  const sections = document.querySelectorAll('.slide');
  const total = sections.length;
  let cur = 0;
  const dotsContainer = document.getElementById('navDots');
  const counter = document.getElementById('counter');
  const progress = document.getElementById('progress');
  
  sections.forEach((s, i) => {
    const dot = document.createElement('button');
    dot.className = 'nav-dot' + (i === 0 ? ' active' : '');
    dot.setAttribute('aria-label', '跳转到第 ' + (i + 1) + ' 页');
    dot.onclick = () => go(i);
    dotsContainer.appendChild(dot);
  });
  
  function go(n) {
    if (n < 0 || n >= total) return;
    sections[cur].classList.remove('visible');
    dotsContainer.children[cur].classList.remove('active');
    cur = n;
    sections[cur].classList.add('visible');
    sections[cur].scrollIntoView({ behavior: 'smooth', block: 'start' });
    dotsContainer.children[cur].classList.add('active');
    counter.textContent = (cur + 1) + ' / ' + total;
    const pct = Math.min(100, ((cur + 1) / total) * 100);
    progress.style.width = pct + '%';
  }
  
  document.getElementById('prevBtn').onclick = () => go(cur - 1);
  document.getElementById('nextBtn').onclick = () => go(cur + 1);
  
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
      e.preventDefault();
      go(cur + 1);
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault();
      go(cur - 1);
    } else if (e.key === 'Home') {
      e.preventDefault();
      go(0);
    } else if (e.key === 'End') {
      e.preventDefault();
      go(total - 1);
    }
  });
  
  let wheelTimer = null;
  document.addEventListener('wheel', e => {
    e.preventDefault();
    if (wheelTimer) return;
    wheelTimer = setTimeout(() => wheelTimer = null, 400);
    if (e.deltaY > 0) go(cur + 1);
    else if (e.deltaY < 0) go(cur - 1);
  }, { passive: false });
  
  document.body.addEventListener('click', e => {
    if (e.target.closest('.nav-dot, .nav-dots, .nav-btn, .expert-card, .speech-block, .clash-block, .insight-block, .question-card, .question-header, .round-card, .window, .conclusion-card')) return;
    go(cur + 1);
  });
  
  document.querySelectorAll('.question-header').forEach(header => {
    header.addEventListener('click', e => {
      e.stopPropagation();
      const card = header.closest('.question-card');
      card.classList.toggle('open');
    });
  });
  
  go(0);
})();
</script>
</body>
</html>
