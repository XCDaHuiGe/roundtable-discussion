px}.clash-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:13px;font-weight:700;color:var(--gold)}.insight-card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px}.insight-title{font-size:16px;font-weight:700;margin-bottom:8px;color:var(--fg)}.insight-text{font-size:13px;line-height:1.9;color:var(--fg2)}.tag{display:inline-block;padding:3px 10px;border-radius:4px;font-size:11px;margin-right:6px;margin-bottom:6px;background:rgba(106,99,114,.15);color:var(--muted)}.tag.red{background:rgba(194,59,34,.15);color:var(--accent)}.tag.gold{background:rgba(212,168,67,.15);color:var(--gold)}.expert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin:24px 0}.expert-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center}.expert-icon{width:44px;height:44px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center}.divider{border:none;border-top:1px solid var(--border);margin:24px 0}.track-item{display:flex;align-items:flex-start;gap:16px;padding:14px 0;border-bottom:1px solid var(--border);font-size:13px;line-height:1.7;color:var(--fg2)}.track-round{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;flex-shrink:0}.track-arrow{color:var(--accent);margin:0 4px}.conclusion-quote{font-size:clamp(20px,3vw,32px);font-weight:900;line-height:1.5;margin-bottom:24px;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
@media(max-width:768px){.page{padding:40px 20px}.nav-btn{width:40px;height:40px}.toc-panel{width:280px}}

// 完整html结构 (为了可维护，动态注入每一页内容，避免截断)
function buildPageHTML(idx) {
  if(idx === 0) return `<div class="page-inner"><div class="cover-decoration"></div><div class="anim-up cover-badge">批判性分析 · 锚定原视频论点 · 深度交锋</div><h1 class="anim-up cover-title">儒释道批判性分析</h1><p class="anim-up cover-sub">四小时视频的思想解剖 · 圆桌洞见 V3.0<br>6位跨领域专家 · 6轮深度交锋 · 6核心洞见</p><div class="anim-up cover-stats"><div class="cover-stat"><div class="cover-stat-num">6</div><div class="cover-stat-label">参与专家</div></div><div class="cover-stat"><div class="cover-stat-num">6</div><div class="cover-stat-label">讨论轮次</div></div><div class="cover-stat"><div class="cover-stat-num">24+</div><div class="cover-stat-label">碰撞交锋</div></div><div class="cover-stat"><div class="cover-stat-num">3</div><div class="cover-stat-label">颠覆性观点</div></div></div></div>`;
  if(idx === 1) return `<div class="page-inner"><div class="anim-up section-label meta">原视频论点</div><h2 class="anim-up section-title">原视频六大核心论点</h2><p class="anim-up section-subtitle">我们将对其进行深度批判性分析</p><div class="thesis-card"><div class="thesis-num">论点 1</div><div class="thesis-text">"想挣钱怎么办？非常简单。回家买本论语每天读两张就够了。问题是你肯定不信，能执行吗？"</div><div class="thesis-source">— 原视频 0:02:30</div></div><div class="thesis-card"><div class="thesis-num">论点 2</div><div class="thesis-text">"大多数讨厌孔子的人，并不是因为觉得孔子说的那些话有哪儿不对，都只是因为咱们自己做不到而已。"</div><div class="thesis-source">— 原视频 0:15:40</div></div><div class="thesis-card"><div class="thesis-num">论点 3</div><div class="thesis-text">"身体是革命的本钱。儒道互补，虚中有实。"</div><div class="thesis-source">— 原视频 1:02:15</div></div><div class="thesis-card"><div class="thesis-num">论点 4</div><div class="thesis-text">"真正能做成事走得远的人，靠的是让人安心舒服的氛围，而不是权谋手段。"</div><div class="thesis-source">— 原视频 2:45:20</div></div><div class="thesis-card"><div class="thesis-num">论点 5</div><div class="thesis-text">"佛学给知识分子看的和老百姓嘴里传播的完全不是一套。苏东坡、乔布斯都有冥想经历。"</div><div class="thesis-source">— 原视频 1:35:10</div></div><div class="thesis-card"><div class="thesis-num">论点 6</div><div class="thesis-text">叙事结构：承认现实不完美 → 用儒释道"理解"现实 → 接受现状、让自己舒服</div><div class="thesis-source">— 整体基调</div></div></div>`;
  if(idx === 2) return `<div class="page-inner"><div class="anim-up section-label meta">讨论仪表盘</div><h2 class="anim-up section-title">参与专家与批判框架</h2><div class="stats-row" style="display:flex;gap:32px;margin:20px 0"><div class="stat-item"><div class="stat-num">6</div><div class="stat-label">专家</div></div><div class="stat-item"><div class="stat-num">6</div><div class="stat-label">轮次</div></div><div class="stat-item"><div class="stat-num">24+</div><div class="stat-label">交锋</div></div></div><hr class="divider"><h3 style="color:var(--gold);margin-bottom:12px">🧠 六位专家</h3><div class="expert-grid"><div class="expert-card"><div class="expert-icon" style="background:var(--confucius);">孔</div><div>孔子</div></div><div class="expert-card"><div class="expert-icon" style="background:var(--laozi);">老</div><div>老子</div></div><div class="expert-card"><div class="expert-icon" style="background:var(--buddha);">佛</div><div>佛陀</div></div><div class="expert-card"><div class="expert-icon" style="background:var(--luxun);">鲁</div><div>鲁迅</div></div><div class="expert-card"><div class="expert-icon" style="background:var(--plato);">柏</div><div>柏拉图</div></div><div class="expert-card"><div class="expert-icon" style="background:var(--nietzsche);">尼</div><div>尼采</div></div></div><hr class="divider"><h3 style="color:var(--gold);">⚡ 观点演化轨迹</h3><div class="track-item"><div class="track-round" style="background:var(--confucius);">R1</div><div>读论语挣钱 → 王阳明：知行本体，非闻见之知</div></div><div class="track-item"><div class="track-round" style="background:var(--nietzsche);">R2</div><div>讨厌孔子=做不到 → 尼采：奴隶道德的倒置</div></div><div class="track-item"><div class="track-round" style="background:var(--plato);">R3</div><div>儒道互补 → 柏拉图：缺少程序正义的机会主义</div></div><div class="track-item"><div class="track-round" style="background:var(--luxun);">R4</div><div>人格魅力→鲁迅：无制度约束即高级操纵</div></div><div class="track-item"><div class="track-round" style="background:var(--buddha);">R5</div><div>精英佛学→佛陀：知识分子的傲慢</div></div><div class="track-item"><div class="track-round" style="background:var(--nietzsche);">R6</div><div>和解叙事→全场：跳过批判的接受是精神鸦片</div></div></div>`;
  if(idx === 3) return `<div class="page-inner"><div class="anim-up section-label r1">Round 1</div><h2 class="anim-up section-title">简单道理 ≠ 能执行</h2><div class="quote-block"><div class="quote-text">"想挣钱怎么办？买本论语每天读两张就够了。"</div></div><div class="speaker-block confucius"><div class="speaker-header"><div class="speaker-avatar" style="background:var(--confucius);">王</div><div><div class="speaker-name">王阳明</div></div></div><div class="speaker-content">"知行合一"的"知"是本体之知，读论语而无行则非真知。原视频将"闻见之知"当作成功钥匙，因果倒置。</div></div><div class="speaker-block luxun"><div class="speaker-header"><div class="speaker-avatar" style="background:var(--luxun);">鲁</div><div><div class="speaker-name">鲁迅</div></div></div><div class="speaker-content">闰土不知勤劳致富？结构限制行动能力。这是精英偏见：成功人士读论语≠读论语让人成功。</div></div></div>`;
  if(idx === 4) return `<div class="page-inner"><div class="anim-up section-label r1">碰撞交锋</div><h2 class="anim-up section-title">知行鸿沟：认知还是结构？</h2><div class="clash-block"><div class="clash-header"><i class="fas fa-bolt"></i> 柏拉图 → 王阳明</div><div class="speaker-content">人的行为受认知、意志、执行三重约束，"知"只解决第一层。习惯需要反复训练，不是读书能解决。</div></div><div class="clash-block"><div class="clash-header"><i class="fas fa-bolt"></i> 尼采 → 鲁迅</div><div class="speaker-content">强调"结构性障碍"可能强化无助感，忽略了人的能动性。原视频和反驳都让人感到"我不够好"。</div></div><div class="clash-block"><div class="clash-header"><i class="fas fa-bolt"></i> 老子</div><div class="speaker-content">马云早期更接近"无为而治"，儒家文化圈发展差异巨大，真实变量是制度资源而非论语。</div></div></div>`;
  if(idx === 5) return `<div class="page-inner"><div class="anim-up section-label r2">Round 2</div><h2 class="anim-up section-title">讨厌孔子 = 自己做不到？</h2><div class="quote-block"><div class="quote-text">"讨厌孔子的人只是因为自己做不到"</div></div><div class="speaker-block nietzsche"><div class="speaker-header"><div class="speaker-avatar" style="background:var(--nietzsche);">尼</div><div><div class="speaker-name">尼采</div></div></div><div class="speaker-content">这是奴隶道德的变种：弱者无法超越，便将反抗解释为怨气。真正的强者不在乎你的标准。</div></div><div class="speaker-block luxun"><div class="speaker-header"><div class="speaker-avatar" style="background:var(--luxun);">鲁</div><div><div class="speaker-name">鲁迅</div></div></div><div class="speaker-content">把对不公正秩序的反抗解释为个人失败，是刽子手对受害者说"你恨我是因为你做不到杀人"。</div></div></div>`;
  if(idx === 6) return `<div class="page-inner"><div class="anim-up section-label r2">碰撞交锋</div><h2 class="anim-up section-title">谁有权定义压迫？</h2><div class="clash-block"><div class="clash-header">孔子 → 鲁迅</div><div class="speaker-content">用今天的价值观批判2500年前的思想是否公平？《论语》说"当仁不让于师"，后世统治收编非我本意。</div></div><div class="clash-block"><div class="clash-header">尼采</div><div class="speaker-content">马丁·路德·金讨厌种族主义，并非"做不到"，而是追求更高的正义。</div></div></div>`;
  if(idx === 7) return `<div class="page-inner"><div class="anim-up section-label r3">Round 3</div><h2 class="anim-up section-title">儒道互补？实用主义的陷阱</h2><div class="quote-block"><div class="quote-text">"道家修身+儒家立功，虚实互补"</div></div><div class="speaker-block plato"><div class="speaker-header"><div class="speaker-avatar" style="background:var(--plato);">柏</div><div><div class="speaker-name">柏拉图</div></div></div><div class="speaker-content">无程序正义约束的"互补"就是精致的机会主义——顺势时儒家，逆境时道家，本质是利己。</div></div><div class="speaker-block laozi"><div class="speaker-header"><div class="speaker-avatar" style="background:var(--laozi);">老</div><div><div class="speaker-name">老子</div></div></div><div class="speaker-content">"无为"不是逃避，而是顺应规律。若以功利为目的切换儒道，已是失道。</div></div></div>`;
  if(idx === 8) return `<div class="page-inner"><div class="anim-up section-label r3">碰撞交锋</div><h2 class="anim-up section-title">原则vs变通</h2><div class="clash-block"><div class="clash-header">鲁迅</div><div class="speaker-content">所谓"互补"让士大夫在朝堂与山林间无缝切换，丧失了知识分子的公共性。</div></div><div class="clash-block"><div class="clash-header">尼采</div><div class="speaker-content">这种"互补"恰恰是弱者生存策略，不敢坚持单一价值。</div></div></div>`;
  if(idx === 9) return `<div class="page-inner"><div class="anim-up section-label r4">Round 4</div><h2 class="anim-up section-title">成功靠人格魅力？</h2><div class="quote-block"><div class="quote-text">"做成事靠让人安心的氛围，而非权谋"</div></div><div class="speaker-block luxun"><div class="speaker-header"><div class="speaker-avatar" style="background:var(--luxun);">鲁</div><div><div class="speaker-name">鲁迅</div></div></div><div class="speaker-content">没有制度约束的"人格魅力"只是高级操纵。封建家族、黑帮同样讲"氛围"，这种叙事掩盖了权力结构。</div></div><div class="speaker-block plato"><div class="speaker-header"><div class="speaker-avatar" style="background:var(--plato);">柏</div><div><div class="speaker-name">柏拉图</div></div></div><div class="speaker-content">哲学王需要正义制度，而非个人魅力。原视频将成功归因于魅力，回避了法治与制衡。</div></div></div>`;
  if(idx === 10) return `<div class="page-inner"><div class="anim-up section-label r4">碰撞交锋</div><h2 class="anim-up section-title">魅力·制度·权力</h2><div class="clash-block"><div class="clash-header">尼采</div><div class="speaker-content">魅力本身是权力意志的体现，但原视频将"让人舒服"变成新的道德绑架——仿佛你不让人舒服就是失败。</div></div><div class="clash-block"><div class="clash-header">孔子</div><div class="speaker-content">"君子和而不同"，真正的氛围是尊重原则，而非讨好。</div></div></div>`;
  if(idx === 11) return `<div class="page-inner"><div class="anim-up section-label r5">Round 5</div><h2 class="anim-up section-title">精英佛学 ≠ 民间信仰？</h2><div class="quote-block"><div class="quote-text">"知识分子佛学和老百姓嘴里传播的不是一套"</div></div><div class="speaker-block buddha"><div class="speaker-header"><div class="speaker-avatar" style="background:var(--buddha);">佛</div><div><div class="speaker-name">佛陀</div></div></div><div class="speaker-content">我从未区分精英与大众。四圣谛、八正道对一切众生平等。强调"精英佛学"是知识分子的傲慢与自我美化。</div></div><div class="speaker-block luxun"><div class="speaker-header"><div class="speaker-avatar" style="background:var(--luxun);">鲁</div><div><div class="speaker-name">鲁迅</div></div></div><div class="speaker-content">将佛学分为精英版和迷信版，本质是维护文化资本，让底层继续烧香，顶层谈哲学。</div></div></div>`;
  if(idx === 12) return `<div class="page-inner"><div class="anim-up section-label r5">碰撞交锋</div><h2 class="anim-up section-title">真理的等级制</h2><div class="clash-block"><div class="clash-header">柏拉图</div><div class="speaker-content">若真理有等级，谁有权定义"高级真理"？这导向哲人王专制。</div></div><div class="clash-block"><div class="clash-header">尼采</div><div class="speaker-content">区分"精英/大众"版本哲学，正是教士道德的手段，使人依附于解释者。</div></div></div>`;
  if(idx === 13) return `<div class="page-inner"><div class="anim-up section-label r6">Round 6</div><h2 class="anim-up section-title">和解叙事：精神鸦片还是智慧？</h2><div class="quote-block"><div class="quote-text">承认现实不完美 → 儒释道理解现实 → 接受现状</div></div><div class="speaker-block nietzsche"><div class="speaker-header"><div class="speaker-avatar" style="background:var(--nietzsche);">尼</div><div><div class="speaker-name">尼采</div></div></div><div class="speaker-content">跳过批判直接要求"和解"，是弱者对苦难的浪漫化。真正的智慧是抗争与超越，而非自我麻醉。</div></div><div class="speaker-block luxun"><div class="speaker-header"><div class="speaker-avatar" style="background:var(--luxun);">鲁</div><div><div class="speaker-name">鲁迅</div></div></div><div class="speaker-content">"在铁屋子里醒来"才是哲学任务。原视频教人舒服地睡回去。</div></div></div>`;
  if(idx === 14) return `<div class="page-inner"><div class="anim-up section-label r6">终极碰撞</div><h2 class="anim-up section-title">批判不可跳过</h2><div class="clash-block"><div class="clash-header">全体共识</div><div class="speaker-content">原视频最大的叙事陷阱：跳过对现实不公正的批判，直接让个体用儒释道调整心态。这助长了结构性的恶，让受害者自我归因。真正的古典智慧(儒的批判精神、道的自然、佛的平等)被异化为维稳工具。</div></div><div class="insight-card"><div class="insight-title">颠覆性结论</div><div class="insight-text">未经审视的"和解"不是智慧，是精神奴役。批判性继承传统，才可能走向真正的自由。</div></div></div>`;
  if(idx === 15) return `<div class="page-inner"><div class="anim-up section-label insight">六重构洞见</div><h2 class="anim-up section-title">超越原视频 · 批判性觉醒</h2><div class="insight-card"><div class="insight-num">01</div><div class="insight-title">知行本体论</div><div class="insight-text">知与行是一体，做不到就是假知，而非"信不够"。</div></div><div class="insight-card"><div class="insight-num">02</div><div class="insight-title">反抗的合法性</div><div class="insight-text">讨厌一个标准可能因为更高的正义，而非无能。</div></div><div class="insight-card"><div class="insight-num">03</div><div class="insight-title">程序正义优先</div><div class="insight-text">儒道互补若无制度约束，沦为机会主义。</div></div><div class="insight-card"><div class="insight-num">04</div><div class="insight-title">魅力祛魅</div><div class="insight-text">人格魅力需与权力制衡共存，否则为操纵术。</div></div><div class="insight-card"><div class="insight-num">05</div><div class="insight-title">真理去等级化</div><div class="insight-text">真理不应有精英/大众之分，那是知识傲慢。</div></div><div class="insight-card"><div class="insight-num">06</div><div class="insight-title">批判性和解</div><div class="insight-text">和解之前必须有批判，否则是精神麻痹。</div></div></div>`;
  if(idx === 16) return `<div class="page-inner"><div class="anim-up conclusion-quote">批判的武器不能代替武器的批判</div><div class="conclusion-text">原视频提供了精致的"情绪按摩术"，却剥夺了读者反思不公正结构的可能。儒释道的真正生命力在于其批判性——孔子"苛政猛于虎"，老子"民之饥以其上食税之多"，佛陀"众生平等"。把这些降格为成功学或心灵安慰，才是对传统最大的背叛。</div><div class="conclusion-text"><strong>圆桌洞见 · 共识：</strong> 理解传统，是为了更清醒地反抗不公，而非更舒服地接受现状。</div><div class="conclusion-text" style="margin-top:32px;color:var(--gold);text-align:right">—— 六位跨时空思想者 于批判之镜</div></div>`;
  return `<div class="page-inner"><h2>页面载入错误</h2></div>`;
}

// 构建所有页面DOM
const wrapper = document.getElementById('pagesWrapper');
for(let i=0; i<17; i++) {
  const pageDiv = document.createElement('div');
  pageDiv.className = 'page' + (i===0 ? ' active' : '');
  pageDiv.setAttribute('data-page', i);
  pageDiv.innerHTML = buildPageHTML(i);
  wrapper.appendChild(pageDiv);
}

// 交互逻辑
let currentPage = 0;
const total = 17;
const pages = document.querySelectorAll('.page');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const pageSpan = document.querySelector('#pageIndicator span');
const progressBar = document.getElementById('progressBar');
const tocToggle = document.getElementById('tocToggle');
const tocPanel = document.getElementById('tocPanel');
const tocOverlay = document.getElementById('tocOverlay');
const tocList = document.getElementById('tocList');

function updateUI() {
  pageSpan.innerText = currentPage+1;
  const percent = ((currentPage)/(total-1))*100;
  progressBar.style.width = `${percent}%`;
  if(currentPage === 0) prevBtn.classList.add('disabled');
  else prevBtn.classList.remove('disabled');
  if(currentPage === total-1) nextBtn.classList.add('disabled');
  else nextBtn.classList.remove('disabled');
  // 更新目录高亮
  document.querySelectorAll('.toc-item').forEach((item, idx) => {
    if(idx === currentPage) item.classList.add('active');
    else item.classList.remove('active');
  });
}

function goToPage(page) {
  if(page < 0 || page >= total) return;
  const current = pages[currentPage];
  current.classList.remove('active');
  current.classList.add('exit-left');
  setTimeout(() => { current.classList.remove('exit-left'); }, 600);
  currentPage = page;
  const next = pages[currentPage];
  next.classList.add('active');
  updateUI();
  window.scrollTo(0,0);
}

function nextPage() { if(currentPage < total-1) goToPage(currentPage+1); }
function prevPage() { if(currentPage > 0) goToPage(currentPage-1); }

prevBtn.addEventListener('click', prevPage);
nextBtn.addEventListener('click', nextPage);
window.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowLeft') prevPage();
  if(e.key === 'ArrowRight') nextPage();
});

// 目录生成
pagesData.forEach((p, i) => {
  const item = document.createElement('div');
  item.className = 'toc-item' + (i===0 ? ' active' : '');
  item.innerText = `${i+1}. ${p.title}`;
  item.addEventListener('click', () => {
    goToPage(i);
    tocPanel.classList.remove('open');
    tocOverlay.classList.remove('open');
  });
  tocList.appendChild(item);
});
tocToggle.addEventListener('click', () => {
  tocPanel.classList.toggle('open');
  tocOverlay.classList.toggle('open');
});
tocOverlay.addEventListener('click', () => {
  tocPanel.classList.remove('open');
  tocOverlay.classList.remove('open');
});

// 动态背景Canvas + 鼠标光晕
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let width = window.innerWidth, height = window.innerHeight;
function resizeCanvas() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
const particles = [];
for(let i=0;i<80;i++) particles.push({ x:Math.random()*width, y:Math.random()*height, radius:Math.random()*1.5+0.5, alpha:Math.random()*0.4+0.1, speedX:(Math.random()-0.5)*0.2, speedY:(Math.random()-0.5)*0.2 });
function drawBg() {
  if(!ctx) return;
  ctx.clearRect(0,0,width,height);
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0,0,width,height);
  for(let p of particles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
    ctx.fillStyle = `rgba(212,168,67,${p.alpha*0.6})`;
    ctx.fill();
    p.x += p.speedX; p.y += p.speedY;
    if(p.x<0) p.x=width; if(p.x>width) p.x=0;
    if(p.y<0) p.y=height; if(p.y>height) p.y=0;
  }
  requestAnimationFrame(drawBg);
}
drawBg();

const glow = document.getElementById('cursorGlow');
document.addEventListener('mousemove', (e) => {
  glow.style.left = e.clientX + 'px';
  glow.style.top = e.clientY + 'px';
});
updateUI();
</script>
</body>
